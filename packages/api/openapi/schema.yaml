          description: "이 셀러 주문의 배송비(셀러 몫)"
        totalProductAmount:
          type: integer
          format: int64
          description: "주문그룹 전체 상품 금액"
        totalShippingFee:
          type: integer
          format: int64
          description: "주문그룹 전체 배송비"
        couponDiscountAmount:
          type: integer
          format: int64
          description: "주문그룹 전체 쿠폰 할인(현재 항상 0)"
        usedPoint:
          type: integer
          format: int64
          description: "주문그룹 전체 적립금 사용액"
        finalPaymentAmount:
          type: integer
          format: int64
          description: "주문그룹 전체 최종 결제액"
