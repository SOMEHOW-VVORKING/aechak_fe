      description: >-
        닉네임을 확정하며 PENDING_ONBOARDING → ACTIVE로 전이한다(PENDING 전용). 응답 status는 ACTIVE.
        필수 동의가 미완이면 403 errorCode 30300, 형식 위반은 400 errorCode 30002,
        중복은 409 errorCode 30001(커밋 시점 최종 판정), 이미 ACTIVE면 409 errorCode 30004,
