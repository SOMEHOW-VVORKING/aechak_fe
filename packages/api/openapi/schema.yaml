      summary: "뮤트 관리 목록(최근 뮤트순)"
      description: "규칙은 차단 관리 목록과 같다. 뮤트한 상대가 나를 차단해도 목록에 남는다."
      operationId: "getMyMutes"
      security:
        - bearerAuth: []
      parameters:
