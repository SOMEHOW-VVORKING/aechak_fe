openapi: "3.0.3"
info:
  title: "Aechak API"
  description: "Backend OpenAPI spec — 백엔드 컨트롤러와 수동 동기화한다"
  version: "0.0.1"
# 경로 작성 규칙: /api/v1 접두 없이 쓴다 — axios 인스턴스 baseURL(client.ts)이 접두를 담당하므로
# 여기 경로에 접두를 넣으면 /api/v1이 두 번 붙는다. servers의 /api/v1은 문서 정확성용(orval은 무시).
servers:
  - url: "http://localhost:8080/api/v1"
    description: "Local development"
  - url: "https://api.aechak.com/api/v1"
    description: "Production"
paths:
  /health:
    get:
      summary: "Health check"
      operationId: "healthCheck"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
  /breeds:
    get:
      summary: "품종 목록 조회"
      description: "종별 품종 목록(가나다순, 종별 '세상에 하나뿐인 믹스'/'기타'가 마지막). 인증 필요(비로그인 401 errorCode 20005) — PENDING_ONBOARDING 유저 허용."
      operationId: "getBreeds"
      security:
        - bearerAuth: []
      parameters:
        - name: species
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Species"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedListResponse"
  /delivery-addresses:
    get:
      summary: "배송지 목록 조회"
      description: "본인 배송지만. 기본 배송지가 최상단, 그 아래는 최신 수정순."
      operationId: "getDeliveryAddresses"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAddressListResponse"
    post:
      summary: "배송지 추가"
      description: "최대 10개(초과 422 errorCode 30120). isDefault=true면 기존 기본은 자동 해제."
      operationId: "addDeliveryAddress"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDeliveryAddressRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddDeliveryAddressResponse"
  /delivery-addresses/{addressId}:
    patch:
      summary: "배송지 수정"
      description: "전체 객체 전송. isDefault=true면 기본 지정(기존 기본 해제), false/생략이면 기본 상태 유지."
      operationId: "updateDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryAddressRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDeliveryAddressResponse"
    delete:
      summary: "배송지 삭제"
      description: "기본 배송지 삭제 시 남은 것 중 최신이 자동 승격 — 승격된 id를 응답으로 준다(없으면 null)."
      operationId: "deleteDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDeliveryAddressResponse"
  /delivery-addresses/{addressId}/default:
    patch:
      summary: "기본 배송지 지정"
      description: "지정 건만 기본이 되고 나머지는 자동 해제(서버 소유 유일성)."
      operationId: "setDefaultDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetDefaultDeliveryAddressResponse"
components:
  schemas:
    Species:
      type: string
      enum: [DOG, CAT]
    BreedResponse:
      type: object
      required: [breedId, label]
      properties:
        breedId:
          type: integer
          format: int64
        label:
          type: string
    BreedListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BreedResponse"
    DeliveryAddressResponse:
      type: object
      required: [addressId, receiverName, contactNumber, zipCode, baseAddress, isDefault]
      properties:
        addressId:
          type: integer
          format: int64
        receiverName:
          type: string
        contactNumber:
          type: string
        zipCode:
          type: string
        baseAddress:
          type: string
        detailedAddress:
          type: string
          nullable: true
        deliveryMemo:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        isDefault:
          type: boolean
    DeliveryAddressListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [addresses, totalCount]
          properties:
            addresses:
              type: array
              items:
                $ref: "#/components/schemas/DeliveryAddressResponse"
            totalCount:
              type: integer
    AddDeliveryAddressRequest:
      type: object
      required: [receiverName, contactNumber, zipCode, baseAddress, detailedAddress]
      properties:
        receiverName:
          type: string
        contactNumber:
          type: string
          description: "휴대폰 번호 ^01[016789]-?\\d{3,4}-?\\d{4}$"
        zipCode:
          type: string
          description: "5자리 숫자"
        baseAddress:
          type: string
        detailedAddress:
          type: string
        deliveryMemo:
          type: string
        label:
          type: string
        isDefault:
          type: boolean
          description: "생략=false"
    UpdateDeliveryAddressRequest:
      $ref: "#/components/schemas/AddDeliveryAddressRequest"
    AddDeliveryAddressResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [addressId, isDefault, totalCount]
          properties:
            addressId:
              type: integer
              format: int64
            isDefault:
              type: boolean
            totalCount:
              type: integer
    UpdateDeliveryAddressResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [addressId, isDefault]
          properties:
            addressId:
              type: integer
              format: int64
            isDefault:
              type: boolean
    SetDefaultDeliveryAddressResponse:
      $ref: "#/components/schemas/UpdateDeliveryAddressResponse"
    DeleteDeliveryAddressResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            promotedDefaultAddressId:
              type: integer
              format: int64
              nullable: true
              description: "기본 삭제로 자동 승격된 배송지 id — 승격 없으면 null"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
