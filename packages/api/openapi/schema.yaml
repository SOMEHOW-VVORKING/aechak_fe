      properties:
        cartItemIds:
          type: array
          minItems: 1
          description: "주문할 본인 장바구니 행 id. 중복은 하나로 접힌다"
          items:
            type: integer
            format: int64
        deliveryAddressId:
          type: integer
          format: int64
        usedPoint:
          type: integer
          format: int64
          minimum: 0
          description: "적립금 사용액(원). 0 또는 1,000 이상"
        expectedFinalAmount:
          type: integer
          format: int64
          minimum: 0
