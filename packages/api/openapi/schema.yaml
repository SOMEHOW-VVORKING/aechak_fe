  /users/nickname/check:
    get:
      summary: "닉네임 가용성 확인(UX 보조)"
      description: >-
        닉네임 중복·형식을 미리 확인한다. 본인 현재 닉네임은 available=true. NFC 정규화 후
        완성형 한글·영문·숫자 2~12자가 아니면 400 errorCode 30002, 파라미터 누락은 400 errorCode 90001.
        보조 판정일 뿐이며 최종 중복 판정은 PUT /users/me/nickname의 409 errorCode 30001이다.
      operationId: "checkNickname"
