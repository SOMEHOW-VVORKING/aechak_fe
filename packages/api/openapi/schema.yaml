        응답의 expiresInSeconds/resendCooldownSeconds가 FE 타이머의 원천이다(수치 하드코딩 금지 — 서버 계약).
        번호 형식 위반은 400 errorCode 90001, 재발송 쿨다운은 429 errorCode 30006,
        일 발송 상한 초과는 429 errorCode 30008, SMS 벤더 발송 실패는 502 errorCode 30007.
      operationId: "sendPhoneCode"
