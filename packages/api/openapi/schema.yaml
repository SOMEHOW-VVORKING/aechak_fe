      enum: [PENDING_PAYMENT, PAID, PREPARING, DISPATCH_PENDING, SHIPPING, DELIVERED, PURCHASE_CONFIRMED, CANCELLED]
    OrderItemStatus:
      type: string
      enum: [ORDERED, CANCELLED, RETURN_REQUESTED, RETURNED, EXCHANGE_REQUESTED]
    ClaimType:
      type: string
      description: "클레임 유형(be ClaimType). 취소는 발송 전, 반품·교환은 배송완료 건만"
      enum: [CANCEL, RETURN, EXCHANGE]
