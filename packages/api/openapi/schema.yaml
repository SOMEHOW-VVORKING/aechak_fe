      operationId: "muteUser"
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SnsPublicId"
      responses:
        "201":
          description: "Created(본문 없음)"
    delete:
      summary: "뮤트 해제(멱등 끄기)"
