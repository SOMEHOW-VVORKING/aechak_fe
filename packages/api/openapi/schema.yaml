openapi: "3.0.3"
info:
  title: "Aechak API"
  description: "Backend OpenAPI spec — 백엔드 컨트롤러와 수동 동기화한다"
  version: "0.0.1"
# 경로 작성 규칙: /api/v1 접두 없이 쓴다 — axios 인스턴스 baseURL(client.ts)이 접두를 담당하므로
# 여기 경로에 접두를 넣으면 /api/v1이 두 번 붙는다. servers의 /api/v1은 문서 정확성용(orval은 무시).
servers:
  - url: "http://localhost:8080/api/v1"
    description: "Local development"
  - url: "https://api.aechak.com/api/v1"
    description: "Production"
paths:
  /health:
    get:
      summary: "Health check"
      operationId: "healthCheck"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
  /breeds:
    get:
      summary: "품종 목록 조회"
      description: "종별 품종 목록(가나다순, 종별 '세상에 하나뿐인 믹스'/'기타'가 마지막). 인증 필요(비로그인 401 errorCode 20004) — PENDING_ONBOARDING 유저 허용."
      operationId: "getBreeds"
      security:
        - bearerAuth: []
      parameters:
        - name: species
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Species"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedListResponse"
  /delivery-addresses:
    get:
      summary: "배송지 목록 조회"
      description: "본인 배송지만. 기본 배송지가 최상단, 그 아래는 최신 수정순."
      operationId: "getDeliveryAddresses"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAddressListResponse"
    post:
      summary: "배송지 추가"
      description: "최대 10개(초과 422 errorCode 30500). isDefault=true면 기존 기본은 자동 해제."
      operationId: "addDeliveryAddress"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDeliveryAddressRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddDeliveryAddressResponse"
  /delivery-addresses/{addressId}:
    patch:
      summary: "배송지 수정"
      description: "전체 객체 전송. isDefault=true면 기본 지정(기존 기본 해제), false/생략이면 기본 상태 유지."
      operationId: "updateDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryAddressRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDeliveryAddressResponse"
    delete:
      summary: "배송지 삭제"
      description: "기본 배송지 삭제 시 남은 것 중 최신이 자동 승격 — 승격된 id를 응답으로 준다(없으면 null)."
      operationId: "deleteDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDeliveryAddressResponse"
  /delivery-addresses/{addressId}/default:
    patch:
      summary: "기본 배송지 지정"
      description: "지정 건만 기본이 되고 나머지는 자동 해제(서버 소유 유일성)."
      operationId: "setDefaultDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetDefaultDeliveryAddressResponse"
  /categories:
    get:
      summary: "카테고리 트리 조회"
      description: "대>중>소(depth<=3) 재귀 카테고리 트리. 인증 필요(SCRUM-106 SecurityConfig 기준 permitAll 아님, 비로그인 401)."
      operationId: "getCategories"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /home:
    get:
      summary: "홈 화면 조회(추천/인기 랭킹)"
      description: "SCRUM-155 HomeController. 인증 필요(SecurityConfig permitAll 아님, 비로그인 401 errorCode 20004, 온보딩 미완료 403 20006). recommended는 판매중 상품 최대 8개 무작위, ranking은 리뷰 수>찜 수>최신 등록순 상위 최대 5개(품절 포함). 펫 개인화 없음. 카드는 상품 목록과 같은 ProductSummaryResponse이며 isLiked는 로그인 사용자 기준."
      operationId: "getHome"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeResponse"
        "401":
          description: "비로그인(errorCode 20004)"
        "403":
          description: "온보딩 미완료(20006) 또는 이용 제한 계정(20005)"
  /products:
    get:
      summary: "상품 목록 조회(커서 페이지네이션)"
      description: "카테고리/정렬/커서 기반 상품 목록. 비로그인 허용(permitAll). category는 categoryId이며 해당 카테고리와 직계 하위(1단계) 상품을 매칭한다(전체 하위 트리 아님)."
      operationId: "getProducts"
      parameters:
        - name: category
          in: query
          required: false
          description: "categoryId 필터"
          schema:
            type: integer
            format: int64
        - name: sort
          in: query
          required: false
          description: "정렬(기본 latest)"
          schema:
            $ref: "#/components/schemas/ProductSort"
        - name: cursor
          in: query
          required: false
          description: "다음 페이지 커서(이전 응답의 nextCursor)"
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /search/products:
    get:
      summary: "키워드 상품 검색(커서 페이지네이션)"
      description: "상품명·셀러명 키워드 검색. 비로그인 허용하며 로그인 사용자의 첫 페이지 검색은 최근 검색어로 기록한다."
      operationId: "searchProducts"
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductKeywordSearchSort"
        - name: minPrice
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: minRating
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: category
          in: query
          required: false
          description: "중분류 categoryId"
          schema:
            type: integer
            format: int64
        - name: freeShipping
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: excludeSoldOut
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /search/keywords:
    get:
      summary: "최근·추천 검색어 조회"
      operationId: "getSearchKeywords"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchKeywordsEnvelope"
  /search/recent-keywords:
    delete:
      summary: "최근 검색어 전체 삭제"
      operationId: "deleteAllRecentKeywords"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "No Content"
  /search/recent-keywords/{id}:
    delete:
      summary: "최근 검색어 단건 삭제"
      operationId: "deleteRecentKeyword"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: "No Content"
  /products/{productId}:
    get:
      summary: "상품 상세 조회"
      description: "상품 상세. 인증 필요(permitAll 매처가 /products 정확 일치라 하위 경로는 비로그인 401). principal로 isLiked를 계산한다. 미존재/노출불가 productId는 404."
      operationId: "getProductDetail"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailEnvelope"
        "404":
          description: "존재하지 않는 상품"
  /products/{productId}/options:
    get:
      summary: "상품 옵션 조회"
      description: "옵션 그룹 + 옵션 조합(조합별 추가금/재고/품절). 인증 필요(상세와 동일, permitAll 아님). 미존재 productId는 404."
      operationId: "getProductOptions"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOptionsEnvelope"
        "404":
          description: "존재하지 않는 상품"
  /products/{productId}/reviews:
    get:
      summary: "상품 리뷰 목록 조회(커서 페이지네이션)"
      description: >-
        상품별 리뷰 목록 + 평점 요약. summary/totalCount는 첫 페이지(cursor 없음)에만 실린다.
        인증 필요(비로그인 401). productId는 상품 공개 ULID. 미존재/비노출 상품은 404.
      operationId: "getProductReviews"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: "정렬(기본 latest)"
          schema:
            $ref: "#/components/schemas/ReviewSort"
        - name: photoOnly
          in: query
          required: false
          description: "사진이 있는 리뷰만"
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          required: false
          description: "다음 페이지 커서(이전 응답의 nextCursor)"
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListEnvelope"
        "404":
          description: "존재하지 않는 상품"
  /reviews:
    post:
      summary: "리뷰 작성"
      description: >-
        구매확정한 주문 품목에 리뷰를 쓴다. 1주문 1리뷰이며 구매확정 30일 이내만 허용한다.
        imageKeys는 presigned 업로드(purpose=REVIEW_IMAGE)로 받은 tmp 키 목록이고 서버가 정식 위치로 옮긴다.
      operationId: "createReview"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateReviewEnvelope"
        "400":
          description: >-
            별점·본문 길이 위반, 구매확정 전(110007), 구매확정 30일 초과(110008),
            사진 5장 초과(110009), 취소·반품한 주문 품목(110010)
        "404":
          description: "리뷰를 쓸 수 있는 주문 품목 없음(110005)"
        "409":
          description: "이미 리뷰를 쓴 주문(110004)"
  /reviews/{reviewId}:
    delete:
      summary: "리뷰 삭제"
      description: >-
        본인이 쓴 리뷰를 소프트 삭제한다(재작성 불가). 삭제 시 상품 평점 평균·리뷰 수가 재집계된다.
      operationId: "deleteReview"
      security:
        - bearerAuth: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: "No Content(본문 없음)"
        "403":
          description: "본인 리뷰가 아님(110003)"
        "404":
          description: "존재하지 않거나 이미 삭제된 리뷰(110000)"
  /products/{productId}/like:
    post:
      summary: "상품 찜하기"
      description: "상품을 찜 목록에 추가한다(멱등 — 이미 찜한 상품도 201). 미존재 productId는 404 errorCode 40000."
      operationId: "likeProduct"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: "Created(본문 없음)"
        "404":
          description: "존재하지 않는 상품(errorCode 40000)"
    delete:
      summary: "상품 찜 해제"
      description: "상품을 찜 목록에서 제거한다(멱등 — 찜하지 않은 상품도 204)."
      operationId: "unlikeProduct"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "No Content(본문 없음)"
  /files/presigned-url:
    post:
      summary: "업로드 presigned URL 발급"
      description: >-
        발급받은 url에 파일을 PUT하고, 돌려받은 key를 도메인 API(펫 등록·수정 등)에 실어 보낸다.
        키는 tmp 영역이고 도메인 API가 정식 위치로 옮긴다. 지원 형식은 purpose별로 다르다.
      operationId: "issuePresignedUrl"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssuePresignedUrlRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUrlResponse"
  /users/me:
    get:
      summary: "내 정보 조회"
      description: >-
        로그인 사용자의 프로필. PENDING_ONBOARDING이면 nickname·profileImageUrl·profileImageKey·bio가
        모두 null이다. profileImageKey는 프로필 수정에서 사진을 유지할 때 그대로 되돌려 보낼 원본 키다(역파싱 금지).
      operationId: "getMe"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"
    delete:
      summary: "회원 탈퇴"
      description: >-
        계정을 WITHDRAWN으로 바꾸고 모든 세션(refresh)을 폐기한 뒤 refresh 쿠키를 만료(Set-Cookie)한다.
        성공은 204 No Content(빈 바디). 정리되지 않은 거래가 있으면 409 errorCode 30011,
        이미 탈퇴한 계정은 409 errorCode 30003. 탈퇴/정지 계정의 옛 토큰은 상태 필터가 먼저 403 errorCode 20005로 막는다.
        PENDING_ONBOARDING 계정도 호출할 수 있다.
      operationId: "withdraw"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "No Content"
  /users/me/withdrawal/check:
    get:
      summary: "탈퇴 가능 여부 조회"
      description: >-
        탈퇴 안내 화면이 탈퇴 버튼을 열지 정할 때 부른다. 제한 사유 목록은 주지 않고 withdrawable만 준다.
        PENDING_ONBOARDING 계정도 호출할 수 있다.
      operationId: "checkWithdrawal"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalCheckResponse"
  /users/me/liked-products:
    get:
      summary: "내 찜 목록 조회(커서 페이지네이션)"
      description: "로그인 사용자의 찜한 상품 목록. 품절도 saleStatus로 노출하며 자동 삭제하지 않는다. 상품 목록과 동일한 ProductListResponse."
      operationId: "getLikedProducts"
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: "다음 페이지 커서(이전 응답의 nextCursor)"
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          description: "유효하지 않은 커서(errorCode 90002)"
  /users/me/reviews:
    get:
      summary: "내 리뷰 목록 조회(커서 페이지네이션)"
      description: >-
        tab=unreviewed는 구매확정했고 리뷰 행이 없는 주문 품목(구매확정일 desc, 품목 id desc. 30일이 지나도
        canReview=false로 남는다. 리뷰를 지운 품목은 재작성 불가라 빠진다), tab=written은 내가 쓴 리뷰
        (리뷰 id desc, DELETED 제외. HIDDEN/BLOCKED/MASKED도 reviewStatus와 함께 내린다).
        totalCount는 첫 페이지(cursor 없음)에만 실린다. 다른 탭에서 받은 커서는 400(90002).
      operationId: "getMyReviews"
      security:
        - bearerAuth: []
      parameters:
        - name: tab
          in: query
          required: true
          description: "목록 탭. 없거나 다른 값이면 400(90001)"
          schema:
            $ref: "#/components/schemas/MyReviewTab"
        - name: cursor
          in: query
          required: false
          description: "다음 페이지 커서(같은 탭 이전 응답의 nextCursor)"
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyReviewListEnvelope"
        "400":
          description: "탭 누락/오류(90001), size 범위 밖, 유효하지 않은 커서(90002)"
  /users/me/profile:
    put:
      summary: "프로필 수정"
      description: >-
        부분 수정이 아니라 전체 교체다 — nickname·bio·profileImageKey 세 필드를 항상 보낸다.
        bio·profileImageKey에 null을 보내면 값이 지워진다. 사진을 유지하려면 조회에서 받은 profileImageKey를
        그대로 되돌려 보내고, 새 사진은 presigned로 받은 tmp 키를 보낸다. ACTIVE 전용(PENDING 접근은 403 errorCode 20006).
        닉네임 형식 위반은 400 errorCode 30002, 중복은 409 errorCode 30001, 동시 수정 충돌은 409 errorCode 90003.
      operationId: "updateProfile"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"
  /users/me/pets:
    get:
      summary: "내 펫 프로필 목록 조회"
      description: "본인 펫만(소프트 삭제 제외). 대표 펫이 최상단, 그 아래는 등록순. 온보딩 미완료 계정은 403 errorCode 20006."
      operationId: "getPets"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetProfileListResponse"
    post:
      summary: "펫 프로필 등록"
      description: >-
        종·이름·품종은 필수, 생년월·체중·사진은 선택. 회원당 최대 10마리(초과 시 422 errorCode 30600).
        첫 펫은 isDefault 값과 무관하게 대표로 저장된다. isDefault=true면 기존 대표는 서버가 해제한다.
      operationId: "registerPet"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPetProfileRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPetProfileResponse"
  /users/me/pets/{petId}:
    put:
      summary: "펫 프로필 수정"
      description: >-
        부분 수정이 아니라 전체 객체 전송이다 — 유지할 값도 그대로 실어 보내야 하고,
        profileImageKey를 빼면 기존 사진이 지워진다. species는 수정 대상이 아니다.
        타인 펫은 403 errorCode 30602, 없는 펫은 404 errorCode 30601.
      operationId: "updatePet"
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePetProfileRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePetProfileResponse"
    delete:
      summary: "펫 프로필 삭제"
      description: >-
        소프트 삭제. 대표 펫을 지우면 남은 펫 중 가장 최근 등록·수정 건이 대표로 올라가고 그 id를 돌려준다.
      operationId: "deletePet"
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePetProfileResponse"
  /users/me/pets/{petId}/default:
    patch:
      summary: "대표 펫 지정"
      description: "기존 대표는 서버가 해제한다. 바뀐 필드만 돌려주므로 전체가 필요하면 목록을 재조회한다."
      operationId: "setDefaultPet"
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetDefaultPetResponse"
  /users/me/points:
    get:
      summary: "내 적립금 잔액 조회"
      description: "원 단위 적립금 잔액(0 이상 정수). ACTIVE 전용 — 온보딩 미완료(PENDING) 계정이 부르면 403 errorCode 20006, 유저 없음은 404 errorCode 30000. 내역(히스토리)은 범위 밖으로 잔액만 내려준다."
      operationId: "getPointBalance"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointBalanceResponse"
  /carts:
    get:
      summary: "장바구니 조회"
      description: >-
        본인 장바구니를 셀러별 그룹으로 조회. 정렬은 최신 담김순(재담기로 수량만 늘어난 항목은 자리 유지).
        카탈로그에서 내려갔거나 검수 미승인인 항목은 응답에서 제외된다. 합계·배송비·총액 필드는 없다 —
        셀러별 배송비는 FE가 baseShippingFee/freeShippingThreshold로 계산한다(선택되고 주문 가능한 라인의
        price*quantity 합이 임계 이상이면 0, 아니면 baseShippingFee, 임계가 null이면 항상 baseShippingFee).
        장바구니가 없으면 sellerGroups가 빈 배열이다.
      operationId: "getCart"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartEnvelope"
  /carts/items:
    post:
      summary: "장바구니 담기"
      description: >-
        같은 옵션 조합이 이미 있으면 수량을 합산한다. 수량 하한·상한(1~99) 위반과 누적 합산 초과는 모두
        400 errorCode 90001이다(50200은 선언만 있고 서버가 던지지 않는다). 누적 수량이 재고를 넘으면
        409 50201(품절 옵션도 여기 걸린다), 구매 불가 상태 409 50202, 품목 종류(100) 초과 422 50203,
        옵션 조합 미존재·미승인 404 50207. 라인당 99 초과와 재고 부족이 동시면 90001이 먼저,
        판매 중지와 재고 부족이 동시면 50202가 먼저다.
      operationId: "addCartItem"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddCartItemEnvelope"
    delete:
      summary: "장바구니 항목 삭제(목록)"
      description: >-
        개별/선택/전체 삭제를 cartItemIds 목록 하나로 받는다(본문 필수). 빈 배열은 삭제 0건 성공이다.
        내 장바구니에 없는 id(남의 것 포함)는 무시하고 나머지만 지운다(멱등 — 실제 지운 수만 deletedCount에
        반영). 403 50206(남의 항목)은 PATCH /carts/items/{cartItemId}에서만 발생한다.
      operationId: "deleteCartItems"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteCartItemsRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteCartItemsEnvelope"
  /carts/items/{cartItemId}:
    patch:
      summary: "장바구니 항목 수정"
      description: >-
        수량/옵션 조합 변경(둘 중 하나 이상 필수 — 둘 다 없으면 400 90001). quantity는 증감이 아니라
        대입(절대값)이며 1~99 밖이면 400 90001. 수량을 늘리거나 옵션을 바꿀 때만 재고를 검사한다
        (409 50201). 옵션 변경으로 같은 상품의 다른 조합 라인과 합쳐지면 merged=true이고 cartItemId는
        흡수한 라인 id다(합산 결과가 99를 넘으면 400 90001). 다른 상품의 조합으로는 바꿀 수 없다
        (400 90001). 항목 미존재 404 50205, 남의 항목 403 50206, 대상 옵션 조합 미존재 404 50207,
        구매 불가 상태 409 50202.
      operationId: "updateCartItem"
      security:
        - bearerAuth: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCartItemEnvelope"
  /order-groups:
    post:
      summary: "주문그룹 생성(주문서 제출)"
      description: >-
        선택한 장바구니 행으로 주문그룹(결제 단위)과 셀러별 주문을 만든다. 생성 시점에 재고와 적립금이
        차감되며 expiresAt(생성+10분)까지 결제하지 않으면 만료 배치가 취소·복구한다.
        헤더 Idempotency-Key 필수(1~100자, 누락·공백·길이 초과는 400 90004 — 헤더 자체가 없으면 400 90001).
        같은 키로 재요청하면 본문과 무관하게 최초 생성 결과를 201로 다시 돌려준다(본문 대조 없음 —
        품목·금액이 바뀌었으면 FE가 새 키를 써야 한다). 남의 키면 403 90005.
        서버가 금액을 다시 계산해 expectedFinalAmount(상품합+배송비합−usedPoint)와 대조하고 어긋나면
        409 50106(가격·배송비 정책이 바뀐 것 — 장바구니를 다시 조회해 재계산). 그 밖에
        409 50104(주문 불가 상품) / 409 50105(상품 버전 미준비) / 409 50107(재고 부족) /
        404 50205(내 장바구니에 없는 cartItemId) / 404 50207(옵션 조합 없음) /
        400 90001(바인딩 검증 — usedPoint·expectedFinalAmount 음수, cartItemIds 빈 배열) /
        400 50103(적립금 1,000원 미만 사용) / 422 50102(적립금이 결제 가능액 초과) /
        422 50108(최종 결제액 100원 미만) / 409 30101(적립금 잔액 부족) / 404 30501·403 30502(배송지).
        응답 orderGroupId는 결제 paymentId와 같다.
      operationId: "createOrderGroup"
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "주문 시도마다 FE가 만드는 고유 키(1~100자, 공백 금지). 타임아웃·재시도에는 같은 키를 보낸다."
          schema:
            type: string
            minLength: 1
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderGroupRequest"
      responses:
        "201":
          description: "Created(멱등 재요청도 201 + 최초 결과)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderGroupEnvelope"
    get:
      summary: "내 주문 목록(주문그룹 단위, 커서)"
      description: >-
        주문그룹 최신순 커서 페이지네이션. status 세그먼트는 하위 셀러 주문 중 하나라도 해당하면 그룹을
        포함하고, 포함된 그룹의 셀러 주문은 전부 내려준다(completed 탭에 SHIPPING 주문이 섞일 수 있다).
        ongoing=PAID·PREPARING·DISPATCH_PENDING·SHIPPING, completed=DELIVERED·PURCHASE_CONFIRMED,
        cancelled=CANCELLED, all=PENDING_PAYMENT을 뺀 전부(결제대기 그룹은 어느 탭에도 안 나온다).
        totalCount는 첫 페이지(cursor 없음)에만 실리고 이후 null. nextCursor는 다음 페이지가 없으면 null.
        status·size가 범위 밖이면 400 90001, cursor가 깨졌거나 다른 필터의 것이면 400 90002.
      operationId: "getOrderGroups"
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: "세그먼트 필터(기본 all)"
          schema:
            $ref: "#/components/schemas/OrderListStatusFilter"
        - name: cursor
          in: query
          required: false
          description: "다음 페이지 커서(이전 응답의 nextCursor)"
          schema:
            type: string
        - name: size
          in: query
          required: false
          description: "페이지 크기(기본 20)"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListEnvelope"
  /orders/{orderId}:
    get:
      summary: "주문 상세(셀러 주문 단위)"
      description: >-
        셀러별 주문 하나의 품목과 금액. payment.sellerShippingFee만 이 셀러 주문의 몫이고 나머지
        payment 금액(totalProductAmount·totalShippingFee·couponDiscountAmount·usedPoint·finalPaymentAmount)은
        주문그룹 전체 값이다 — 화면에서 이 셀러의 결제액처럼 보이게 하면 안 된다.
        배송지 스냅샷(deliveryAddress)·운송장(shipment)·진행 중 클레임(activeClaim)·
        구매확정 기한(purchaseConfirmDueAt)과 품목 식별자(items[].orderItemId·productId)가 함께 온다.
        없거나 남의 것이거나 결제대기 상태면 구분 없이 404 50000.
      operationId: "getOrderDetail"
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: "orders.public_id (ULID)"
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailEnvelope"
  /orders/{orderPublicId}/confirm:
    post:
      summary: "구매확정"
      description: >-
        배송완료(DELIVERED)이고 진행 중 클레임이 없는 주문만 확정된다. **비가역**이다 —
        확정하면 적립금이 지급되고 반품 기한·정산의 기산점이 된다.
        거절 분기(be OrderErrorCode): 409 50007(배송완료가 아니거나 진행 중 클레임이 있음) /
        409 50008(이미 구매확정됨 — 자동확정이 앞질렀거나 동시 요청에서 경합에 진 경우) /
        404 50000(없음·남의 주문·결제대기).
        성공은 204 No Content(빈 바디)다 — 서버 OpenAPI 문서는 200으로 적고 있으나
        컨트롤러는 `ResponseEntity.noContent()`를 돌려준다(SCRUM-275 계열 문서 불일치).
      operationId: "confirmPurchase"
      security:
        - bearerAuth: []
      parameters:
        - name: orderPublicId
          in: path
          required: true
          description: "orders.public_id (ULID)"
          schema:
            type: string
      responses:
        "204":
          description: "No Content"
  /order-groups/{orderGroupId}/payment/prepare:
    post:
      summary: "결제 준비(포트원 사전등록)"
      description: >-
        결제창을 열기 전 결제 행을 만들고 포트원에 paymentId·금액을 사전등록한다. 응답의
        paymentId(=orderGroupId)·targetAmount·storeId·channelKey를 SDK requestPayment에 그대로 넘긴다
        (currency 'CURRENCY_KRW'·orderName·payMethod·redirectUrl은 FE가 구성). 재호출하면 기존 결제 행을
        돌려주되 사전등록은 매번 다시 보낸다(수단은 최초값 유지).
        404 60008(주문그룹 없음·남의 것) / 409 60006(이미 결제 완료) / 409 60009(취소됐거나 만료 —
        message "결제 가능 시간이 만료되었습니다.") / 400 60007(결제 금액 0원 — 전액 적립금 결제 미지원) /
        502 60005(상점 설정 비어 있음 또는 포트원 사전등록 실패).
      operationId: "preparePayment"
      security:
        - bearerAuth: []
      parameters:
        - name: orderGroupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreparePaymentRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreparePaymentEnvelope"
  /order-groups/{orderGroupId}/payment/complete:
    post:
      summary: "결제 확정 확인(결제창 종료 후 콜백)"
      description: >-
        본문 없음. 서버가 포트원에 결제 상태를 직접 조회해 확정한다. 네 상태 모두 200으로 내려온다 —
        PAID(확정, 주문·주문그룹 결제완료 전이 + 주문한 장바구니 행 삭제), FAILED(PG 실패 확정, 재시도는
        prepare부터), NOT_STARTED(결제 시도 흔적 없음, 재시도는 prepare부터), IN_PROGRESS(PG 승인 대기 —
        잠시 후 재확인). 이미 PAID인 그룹은 몇 번을 불러도 PAID를 멱등 재반환하므로 재진입·새로고침마다
        불러도 안전하다. 404 60008(주문그룹 없음·남의 것) / 409 60010(결제 금액이 주문 금액과 불일치 —
        고객센터 안내) / 409 60011(지원하지 않는 PG 상태 — 고객센터 안내) / 409 60012(만료로 취소된
        주문그룹 — 결제됐다면 환불 처리) / 502 60005(포트원 조회 실패·타임아웃 — 재확인).
      operationId: "completePayment"
      security:
        - bearerAuth: []
      parameters:
        - name: orderGroupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletePaymentEnvelope"
  /terms:
    get:
      summary: "활성 약관 목록 조회"
      description: >-
        가입/온보딩 화면이 그리는 활성 약관 전체(필수·선택 혼합). 인증 필요(비로그인 401 errorCode 20004) —
        PENDING_ONBOARDING 유저 허용. isRequired가 true인 약관은 동의 제출 시 모두 isAgreed=true여야 한다.
      operationId: "getTerms"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermListResponse"
  /users/me/consents:
    post:
      summary: "약관 동의 제출(온보딩)"
      description: >-
        활성 약관에 대한 동의를 한 번에 제출한다. 활성 필수 약관은 전부 isAgreed=true로 포함해야 하고,
        선택(마케팅)은 true/false 모두 수집해 보낸다. items가 비었거나 termId가 중복이면 400 errorCode 90001,
        비활성/미지 termId면 400 errorCode 30400, 필수 동의가 누락/false면 403 errorCode 30300,
        이미 ACTIVE 계정이면 409 errorCode 30004. 성공은 204 No Content(빈 바디).
      operationId: "submitConsents"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitConsentsRequest"
      responses:
        "204":
