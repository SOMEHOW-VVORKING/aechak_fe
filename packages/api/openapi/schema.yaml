    AddCartItemEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AddCartItemResponse"
    UpdateCartItemRequest:
      type: object
      description: "quantity·optionCombinationId 중 하나 이상 필수. quantity는 대입(절대값)."
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        optionCombinationId:
          type: integer
          format: int64
    UpdateCartItemResponse:
      type: object
      required: [cartItemId, quantity, optionCombinationId, merged]
      properties:
        cartItemId:
          type: integer
          format: int64
          description: "merged=true면 흡수한(살아남은) 라인 id"
        quantity:
          type: integer
        optionCombinationId:
          type: integer
          format: int64
        merged:
          type: boolean
    UpdateCartItemEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UpdateCartItemResponse"
    DeleteCartItemsRequest:
      type: object
