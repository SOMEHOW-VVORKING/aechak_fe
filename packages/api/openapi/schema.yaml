            $ref: "#/components/schemas/SellerSettlementSummary"
        totalCount:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer
        totalPages:
          type: integer
          description: "정산이 없으면 0이다(1이 아니다)"
        hasNext:
          type: boolean
    SellerSettlementListResponse:
      type: object
      required: [data]
