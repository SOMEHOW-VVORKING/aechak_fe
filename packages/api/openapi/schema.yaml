          netAmount,
        ]
      properties:
        orderItemId:
          type: integer
          format: int64
        productName:
          type: string
          nullable: true
          description: "주문품목·상품 버전 스냅샷이 없으면 null이다"
        quantity:
          type: integer
          nullable: true
        grossAmount:
          type: integer
          format: int64
        shippingFee:
          type: integer
          format: int64
        commission:
          type: integer
          format: int64
          description: "플랫폼 수수료(원)"
        pgFee:
          type: integer
          format: int64
        sellerCouponBurden:
          type: integer
          format: int64
        refundDeduction:
          type: integer
          format: int64
        netAmount:
          type: integer
          format: int64
          description: "이 품목의 지급 예정액(원). 저장된 값 그대로다"
    SellerSettlementDetailData:
      allOf:
        - $ref: "#/components/schemas/SellerSettlementSummary"
        - type: object
          required:
            [
              shippingFee,
              couponBurden,
              platformFeeAmount,
              pgFeeAmount,
              refundDeduction,
              platformFeeRate,
              pgFeeRate,
              items,
            ]
          properties:
            shippingFee:
              type: integer
              format: int64
            couponBurden:
              type: integer
              format: int64
              description: "셀러가 부담한 쿠폰 금액(원). 수수료가 아니라 별도 차감이다"
            platformFeeAmount:
              type: integer
              format: int64
            pgFeeAmount:
              type: integer
              format: int64
            refundDeduction:
              type: integer
              format: int64
            platformFeeRate:
              type: number
              description: >-
                정산 행에 박힌 생성 시점 요율 스냅샷(비율, DECIMAL(5,4)). 정책이 바뀌어도 과거
                정산은 그대로 둔다 — **화면이 요율을 하드코딩하지 말고 이 값을 쓸 것.**
                서버는 자릿수까지(0.0800) 내려 주지만 JSON 수로 파싱하면 scale이 사라지므로
                표시할 때만 소수 4자리 기준으로 백분율을 만든다(금액은 손대지 않는다)
            pgFeeRate:
              type: number
              description: "platformFeeRate와 같은 규칙"
            items:
              type: array
              items:
                $ref: "#/components/schemas/SellerSettlementItem"
              description: "취소된 정산 행은 빠진다. 요약 금액은 이 배열의 합이다"
    SellerSettlementDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerSettlementDetailData"
    ShippingPolicyData:
      type: object
      required:
        [
          defaultCourierCode,
          baseShippingFee,
          freeShippingThreshold,
          originZipCode,
          originRoadAddress,
          originDetailAddress,
          returnSameAsOrigin,
          returnZipCode,
          returnRoadAddress,
          returnDetailAddress,
          jejuExtraFee,
          remoteAreaExtraFee,
          returnFee,
          exchangeFee,
          avgDispatchDays,
          shippingPolicyText,
        ]
      properties:
        defaultCourierCode:
          type: string
          nullable: true
          description: >-
            courier_masters PK(대문자). 미설정이면 null. 저장 시 이 값을 그대로 되돌려 보낸다
        baseShippingFee:
          type: integer
          format: int64
          description: "기본 배송비(원). 구매자 주문 금액 계산이 읽는 값이다"
        freeShippingThreshold:
          type: integer
          format: int64
          nullable: true
          description: "무료배송 기준 금액(원). null은 무료배송 미운영이고 0원과 다르다"
        originZipCode:
          type: string
          nullable: true
          description: "출고지 우편번호. 스토어 설정의 주소와 같은 컬럼이다"
        originRoadAddress:
          type: string
          nullable: true
        originDetailAddress:
          type: string
          nullable: true
        returnSameAsOrigin:
          type: boolean
          description: >-
            true면 반품지 3필드를 쓰지 않고 출고지를 반품지로 본다. 서버가 이 값으로 반품지
            저장 여부를 가르므로 화면의 체크 상태를 그대로 싣는다
        returnZipCode:
          type: string
          nullable: true
          description: "returnSameAsOrigin=true면 저장되지 않아 null로 내려온다"
        returnRoadAddress:
          type: string
          nullable: true
        returnDetailAddress:
          type: string
          nullable: true
        jejuExtraFee:
          type: integer
          format: int64
        remoteAreaExtraFee:
          type: integer
          format: int64
        returnFee:
          type: integer
          format: int64
        exchangeFee:
          type: integer
          format: int64
          description: "교환 배송비(왕복)"
        avgDispatchDays:
          type: integer
          description: "평균 발송 소요 영업일. 허용 범위는 1~7이고 기본값은 2다"
        shippingPolicyText:
          type: string
          nullable: true
          description: "상품 상세에 붙는 배송 정책 안내문(2000자). 미작성이면 null"
    ShippingPolicyResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ShippingPolicyData"
    ShippingPolicyUpdateRequest:
      type: object
      required:
        [
          baseShippingFee,
          returnSameAsOrigin,
          jejuExtraFee,
          remoteAreaExtraFee,
          returnFee,
          exchangeFee,
          avgDispatchDays,
        ]
      description: >-
        전체 덮어쓰기 본문. 선택 항목을 빼면 비운 것으로 저장된다 — 부분 수정 용도로 쓰지 말 것.
        필수로 적은 일곱은 BE에서 null 불허라 빠지면 400이다(returnSameAsOrigin만 기본값 true).
      properties:
        defaultCourierCode:
          type: string
          nullable: true
          maxLength: 30
        baseShippingFee:
          type: integer
          format: int64
        freeShippingThreshold:
          type: integer
          format: int64
          nullable: true
        originZipCode:
          type: string
          nullable: true
          maxLength: 10
        originRoadAddress:
          type: string
          nullable: true
          maxLength: 255
        originDetailAddress:
          type: string
          nullable: true
          maxLength: 255
        returnSameAsOrigin:
          type: boolean
        returnZipCode:
          type: string
          nullable: true
          maxLength: 10
        returnRoadAddress:
          type: string
          nullable: true
          maxLength: 255
        returnDetailAddress:
          type: string
          nullable: true
          maxLength: 255
        jejuExtraFee:
          type: integer
          format: int64
        remoteAreaExtraFee:
          type: integer
          format: int64
        returnFee:
          type: integer
          format: int64
        exchangeFee:
          type: integer
          format: int64
        avgDispatchDays:
          type: integer
        shippingPolicyText:
          type: string
          nullable: true
          maxLength: 2000
    SellerOrderStatusFilter:
      type: string
      description: >-
        셀러 주문 목록 세그먼트(be SellerOrderStatusFilter). OrderStatus enum 이름이 아니라
        세그먼트 어휘이고 하나가 상태 여러 개를 묶는다 — all = PENDING_PAYMENT를 뺀 전부
        (결제 전 주문이 테이블에 남는 모델이라 셀러에게 미결제 건을 보이지 않는다),
        new = PAID, awaiting-dispatch = PREPARING·DISPATCH_PENDING, shipping = SHIPPING,
        delivered = DELIVERED·PURCHASE_CONFIRMED, cancelled = CANCELLED
      enum: [all, new, awaiting-dispatch, shipping, delivered, cancelled]
      default: all
