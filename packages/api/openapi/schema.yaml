          description: "`yyyy-MM` 최신순"
    SellerSettlementMonthsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerSettlementMonthsData"
    SellerSettlementItem:
      type: object
      required:
        [
          orderItemId,
          productName,
