          $ref: "#/components/schemas/SellerProductListData"
    SellerDashboardPeriod:
      type: string
      enum: [all, 7d, 30d, 90d]
      description: >-
        대시보드 기간 코드. 직전 구간은 현재 구간과 같은 길이로 맞붙는 반개구간이고(`7d`면
        `[now-14d, now-7d)`), `all`에는 직전 구간이 없어 previousValue가 null이다.
    SellerDashboardMetric:
      type: object
      required: [value, previousValue, supported]
      properties:
        value:
          type: integer
          format: int64
        previousValue:
          type: integer
          format: int64
          nullable: true
          description: >-
            **직전 기간 말의 잔량이 아니다.** "직전 구간에 발생(주문·요청)했고 **지금도** 그 단계인
            건수"다 — 집계 스냅샷 테이블이 없어 지금 상태를 기간만 과거로 옮겨 다시 센다. 열흘 전
            요청을 오늘 승인하면 `7d`의 이 값이 올라가고, 셀러가 묵은 건을 처리하면 내려간다.
            그래서 value와의 비율을 "지난 기간보다 늘었다"로 읽으면 뜻이 어긋난다.
            `period=all`이면 비교할 구간이 없어 null이다(0으로 내리지 않는다 — "직전에 0건"과
            "비교 대상 없음"을 가른다).
        supported:
          type: boolean
          description: >-
            false면 값이 아니라 "아직 집계할 수 없다"는 뜻이고 value는 0으로 채워져 온다.
            화면이 0건으로 표기하면 "건수가 없다"와 구분되지 않는다.
            현재 false인 지표는 unansweredInquiries 하나다(셀러에 귀속되는 문의 모델이 없다).
    SellerDashboardMetrics:
      type: object
      required:
        - newOrders
        - awaitingShipment
        - shippingDelayed
        - cancelRequests
        - returnRequests
        - exchangeRequests
        - collectionInvoicePending
        - collectionCompletionPending
        - reshipPending
        - unansweredInquiries
      properties:
        newOrders:
          $ref: "#/components/schemas/SellerDashboardMetric"
        awaitingShipment:
          $ref: "#/components/schemas/SellerDashboardMetric"
        shippingDelayed:
          $ref: "#/components/schemas/SellerDashboardMetric"
        cancelRequests:
          $ref: "#/components/schemas/SellerDashboardMetric"
        returnRequests:
          $ref: "#/components/schemas/SellerDashboardMetric"
        exchangeRequests:
          $ref: "#/components/schemas/SellerDashboardMetric"
        collectionInvoicePending:
          $ref: "#/components/schemas/SellerDashboardMetric"
        collectionCompletionPending:
          $ref: "#/components/schemas/SellerDashboardMetric"
        reshipPending:
          $ref: "#/components/schemas/SellerDashboardMetric"
        unansweredInquiries:
          $ref: "#/components/schemas/SellerDashboardMetric"
    SellerDashboardSettlementSummary:
      type: object
      required: [totalAmount, pendingAmount, onHoldAmount]
      properties:
        totalAmount:
          type: integer
          format: int64
          description: "pendingAmount + onHoldAmount. PAID·CANCELLED는 앞으로 받을 돈이 아니라 빠진다"
        pendingAmount:
          type: integer
          format: int64
        onHoldAmount:
          type: integer
          format: int64
    SellerDashboardProductStatuses:
      type: object
      required: [awaitingInspection, rejected, suspended, soldOut]
      properties:
        awaitingInspection:
          type: integer
          format: int64
        rejected:
          type: integer
          format: int64
        suspended:
          type: integer
          format: int64
        soldOut:
          type: integer
          format: int64
          description: "활성 조합 중 재고가 남은 것이 없음 — 상품 목록의 재고 필터와 같은 판정이다"
    SellerDashboardSummaryData:
      type: object
      required: [metrics, settlement, productStatuses]
      properties:
        metrics:
          $ref: "#/components/schemas/SellerDashboardMetrics"
        settlement:
          $ref: "#/components/schemas/SellerDashboardSettlementSummary"
        productStatuses:
          $ref: "#/components/schemas/SellerDashboardProductStatuses"
      description: >-
        상품 상태 4건수는 서로 배타적이지 않다(판매 중지 상품의 재고가 0이면 중지와 품절에 함께
        센다) — 합이 상품 수와 같을 필요가 없다. shippingDelayed도 awaitingShipment의 부분집합이라
        두 카드의 합이 전체가 아니다.
    SellerDashboardSummaryResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerDashboardSummaryData"
    SellerProductOptionCombination:
      type: object
      required: [optionCombinationId, name, additionalPrice, stockQuantity, isActive]
      properties:
        optionCombinationId:
          type: integer
          format: int64
          description: "내부 숫자 PK — 재고 변경 경로에 그대로 싣는다"
        name:
          type: string
          description: '옵션값을 " / "로 이은 이름. 옵션 없는 상품은 "기본"'
        additionalPrice:
          type: integer
          format: int64
        stockQuantity:
          type: integer
        isActive:
          type: boolean
    SellerProductOptionsData:
      type: object
      required: [optionCombinations]
      properties:
        optionCombinations:
          type: array
          items:
            $ref: "#/components/schemas/SellerProductOptionCombination"
    SellerProductOptionsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerProductOptionsData"
    ClaimSettlementStatus:
      type: string
      description: "클레임 정산 반영 상태(be ClaimSettlementStatus)"
      enum: [PENDING, SETTLED]
    SellerApprovalStatus:
      type: string
      description: >-
        셀러 판단 축(be SellerApprovalStatus). 승인·거부 가능 여부는 상태가 아니라 이 축이 가른다 —
        REQUESTED가 아니면 409 errorCode 50408이다
      enum: [REQUESTED, APPROVED, REJECTED]
    ReturnCostBearer:
      type: string
      description: >-
        반품 발송비 부담 주체(be ReturnCostBearer). 귀책이 아니라 **비용 부담 기준**이고 셀러가
        승인할 때 직접 지정한다 — 서버는 사유로 유도하지 않는다
      enum: [BUYER, SELLER]
    ShipmentType:
      type: string
      description: "배송 종류(be ShipmentType). 초회 발송·회수·교환 재발송이 한 테이블에 공존한다"
      enum: [INITIAL, RETURN_COLLECT, EXCHANGE_RESHIP]
    SellerClaimPendingStage:
      type: string
      description: >-
        셀러가 할 일이 남은 단계(be SellerClaimPendingStage). 목록 필터와 대시보드 처리 대기 집계가
        이 축 하나를 공유한다. DECISION_PENDING=승인·거부 판단 대기(CLAIM_REQUESTED),
        COLLECTION_INVOICE_PENDING=회수 송장 등록 대기(COLLECTING·회수 미시작),
        COLLECTION_COMPLETION_PENDING=회수 완료 처리 대기(COLLECTING·회수 시작됨),
        RESHIP_PENDING=교환 재발송 대기(APPROVED·교환·미종결)
      enum:
        [DECISION_PENDING, COLLECTION_INVOICE_PENDING, COLLECTION_COMPLETION_PENDING, RESHIP_PENDING]
    SellerClaimHistoryEvent:
      type: string
      description: >-
        클레임 진행 이력의 사건 어휘(be SellerClaimHistoryEvent). 이력 전용 테이블이 없어 클레임의
        시각 컬럼에서 조립하며, 종결 시각 한 칸의 성격을 네 축으로 되짚어 이름을 붙인다
        (환불 완료=REFUNDED, 거부=REJECTED, 철회=WITHDRAWN, 개입=ADMIN_OVERRIDDEN, 그 밖=RESOLVED)
      enum:
        [REQUESTED, COLLECTION_STARTED, APPROVED, CLAWBACK_DEPOSITED, REJECTED, WITHDRAWN,
         ADMIN_OVERRIDDEN, REFUNDED, RESOLVED]
    SellerClaimSummary:
      type: object
      description: >-
        셀러 클레임 목록 한 행. 상태를 한 값으로 접지 않고 네 축(status·refundStatus·
        sellerApprovalStatus·settlementStatus)을 그대로 내리며, 반품비 문구도 조립하지 않고 근거
        3필드(returnCostBearer·returnShippingFee·dispatched)만 내린다 — 접는 일은 화면이 한다.
        **collectionStartedAt이 없다** — 회수 중 클레임의 단계(송장 등록 대기 / 완료 처리 대기)는
        이 행만으로 가를 수 없고, 단계 필터(pendingStage)나 상세의 이력이 필요하다.
      required:
        [claimPublicId, orderPublicId, claimType, reasonCode, reasonDetail, status, refundStatus,
         sellerApprovalStatus, settlementStatus, returnCostBearer, returnShippingFee, dispatched,
         refundAmount, productNames, itemCount, rejectionReason, sellerMemo, requestedAt,
         autoApproveDueAt, approvedAt, resolvedAt]
      properties:
        claimPublicId:
          type: string
          description: "클레임 공개 식별자(ULID 26자) — 모든 처리 경로의 경로 변수"
        orderPublicId:
          type: string
        claimType:
          $ref: "#/components/schemas/ClaimType"
        reasonCode:
          type: string
          nullable: true
          description: >-
            구매자가 고른 사유 코드. 고정 어휘 전환(SCRUM-273) 전에는 자유 문자열이라 알 수 없는
            값이 올 수 있다 — 화면이 코드별 라벨 표를 들고 있으면 안 되고 reasonLabel을 쓴다
        reasonLabel:
          type: string
          nullable: true
          description: >-
            사람이 읽을 사유 문구. **SCRUM-273(PR #150)이 머지된 뒤부터 실린다** — 그 전에는 필드
            자체가 없으므로 required에 넣지 않는다. 있으면 쓰고 없으면 reasonCode를 그대로 보여준다
        reasonDetail:
          type: string
          nullable: true
          description: "구매자가 직접 적은 사유 상세(최대 500자). 셀러가 부담 주체를 판단하는 근거다"
        status:
          $ref: "#/components/schemas/ClaimStatus"
        refundStatus:
          allOf:
            - $ref: "#/components/schemas/RefundStatus"
          nullable: true
        sellerApprovalStatus:
          allOf:
            - $ref: "#/components/schemas/SellerApprovalStatus"
          nullable: true
        settlementStatus:
          allOf:
            - $ref: "#/components/schemas/ClaimSettlementStatus"
          nullable: true
        returnCostBearer:
          allOf:
            - $ref: "#/components/schemas/ReturnCostBearer"
          nullable: true
          description: "승인 때 지정된다 — 판단 전이거나 취소 클레임이면 null"
        returnShippingFee:
          type: integer
          format: int64
          nullable: true
          description: >-
            반품 발송비. 취소에는 발생하지 않아 null이고, 셀러 배송 정책 테이블이 생기기 전까지는
            서버 설정값(order.claim.return-shipping-fee, 기본 0)이 정책 스냅샷이다
        dispatched:
          type: boolean
          description: >-
            이 주문의 초회 발송이 끝났는지. 반품비 문구가 "미발송"인지 가르는 근거다.
            **BE 필드명에 is 접두가 없다** — 문서에서 깎인 것이 아니라 원래 dispatched다
        refundAmount:
          type: integer
          format: int64
          description: "환불 예정액 = 품목 환불액 합 + 배송비 환불액. 구매자 목록과 같은 계산기를 쓴다"
        productNames:
          type: array
          items:
            type: string
          description: "대상 품목의 상품명(중복 제거)"
        itemCount:
          type: integer
          description: "대상 품목 수(중복 제거 전)"
        rejectionReason:
          type: string
          nullable: true
        sellerMemo:
          type: string
          nullable: true
          description: "셀러 운영 메모. 어드민 개입 사유(adminReason)와 주체가 다르고 구매자에게 안 나간다"
        requestedAt:
          type: string
          nullable: true
          description: "오프셋 없는 LocalDateTime(예: 2026-10-24T10:00:00)"
        autoApproveDueAt:
          type: string
          nullable: true
          description: "셀러 미응답 자동승인 기한. 지나면 배치가 반품비 부담 주체 없이 승인한다"
        approvedAt:
          type: string
          nullable: true
        resolvedAt:
          type: string
          nullable: true
          description: "종결 시각 한 칸 — 환불 완료·거부·철회·개입·교환 재발송이 모두 여기 찍힌다"
    SellerClaimTypeCounts:
      type: object
      description: >-
        유형별 건수. 세 키는 0이어도 빠지지 않는다(SellerClaimPageResult.of가 채운다).
        **유형 필터를 무시하고** 상태·단계·기간 필터만 반영한다 — 탭 배지용이다
      required: [CANCEL, RETURN, EXCHANGE]
      properties:
        CANCEL:
          type: integer
          format: int64
        RETURN:
          type: integer
          format: int64
        EXCHANGE:
          type: integer
          format: int64
    SellerClaimListData:
      type: object
      required: [claims, totalCount, counts, page, size, totalPages, hasNext]
      properties:
        claims:
          type: array
          items:
            $ref: "#/components/schemas/SellerClaimSummary"
        totalCount:
          type: integer
          format: int64
          description: "필터를 모두 반영한 전체 건수(유형 필터 포함) — counts와 기준이 다르다"
        counts:
          $ref: "#/components/schemas/SellerClaimTypeCounts"
        page:
          type: integer
        size:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
    SellerClaimListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerClaimListData"
    SellerClaimOrderInfo:
      type: object
      description: >-
        클레임 대상 주문. 수령인명·연락처는 복호 평문이라 마스킹은 화면이 한다.
        `sellerShippingFee`는 이 셀러 몫 배송비다(주문그룹 전체가 아니다)
      required:
        [orderPublicId, orderStatus, orderedAt, sellerShippingFee, recipientName, contactNumber,
         zipCode, baseAddress, detailAddress, deliveryMemo]
      properties:
        orderPublicId:
          type: string
        orderStatus:
          $ref: "#/components/schemas/OrderStatus"
        orderedAt:
          type: string
        sellerShippingFee:
          type: integer
          format: int64
        recipientName:
          type: string
        contactNumber:
          type: string
        zipCode:
          type: string
        baseAddress:
          type: string
        detailAddress:
          type: string
          nullable: true
        deliveryMemo:
          type: string
          nullable: true
    SellerClaimItem:
      type: object
      description: "클레임 대상 주문품목. 수량 쪼개기를 받지 않으므로 주문 수량 전부가 대상이다"
      required:
        [orderItemId, productName, optionName, quantity, unitPrice, refundAmount, itemStatus]
      properties:
        orderItemId:
          type: integer
          format: int64
        productName:
          type: string
        optionName:
          type: string
          description: '옵션값을 " / "로 이은 주문 시점 스냅샷. 옵션 없는 상품은 "기본"'
        quantity:
          type: integer
        unitPrice:
          type: integer
          format: int64
        refundAmount:
          type: integer
          format: int64
        itemStatus:
          $ref: "#/components/schemas/OrderItemStatus"
    SellerClaimHistoryEntry:
      type: object
      required: [event, occurredAt]
      properties:
        event:
          $ref: "#/components/schemas/SellerClaimHistoryEvent"
        occurredAt:
          type: string
    SellerClaimDetailData:
      type: object
      required: [claim, order, items, history]
      properties:
        claim:
          $ref: "#/components/schemas/SellerClaimSummary"
        order:
          $ref: "#/components/schemas/SellerClaimOrderInfo"
        items:
          type: array
          items:
            $ref: "#/components/schemas/SellerClaimItem"
        history:
          type: array
          items:
            $ref: "#/components/schemas/SellerClaimHistoryEntry"
          description: "시각 오름차순(같은 시각은 사건 선언 순서). COLLECTION_STARTED 유무가 회수 단계를 가른다"
    SellerClaimDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerClaimDetailData"
    ApproveClaimRequest:
      type: object
      description: >-
        반품비 부담 주체는 반품·교환만 쓴다 — 취소는 비워 보낸다(서버가 저장하지 않는다).
        본문 없이 보내도 서버는 받지만(required=false) 빈 객체를 보내 의도를 드러낸다
      properties:
        returnCostBearer:
          allOf:
            - $ref: "#/components/schemas/ReturnCostBearer"
          nullable: true
    RejectClaimRequest:
      type: object
      required: [rejectionReason]
      properties:
        rejectionReason:
          type: string
          maxLength: 500
          description: "공백만 보내면 400 errorCode 50405. 구매자에게 그대로 노출된다"
    UpdateClaimMemoRequest:
      type: object
      description: "덮어쓰기. null·공백은 삭제로 본다"
      properties:
        sellerMemo:
          type: string
          maxLength: 500
          nullable: true
    StartClaimCollectionRequest:
      type: object
      required: [courierCode, trackingNumber]
      properties:
        courierCode:
          type: string
          maxLength: 30
          description: "GET /sellers/couriers의 대문자 코드 그대로(소문자는 404 errorCode 50303)"
        trackingNumber:
          type: string
          maxLength: 50
    ReshipClaimRequest:
      type: object
      required: [courierCode, trackingNumber]
      properties:
        courierCode:
          type: string
          maxLength: 30
        trackingNumber:
          type: string
          maxLength: 50
    ReshipClaimData:
      type: object
      required: [shipmentType, courierCode, courierName, trackingNumber, dispatchedAt]
      properties:
        shipmentType:
          $ref: "#/components/schemas/ShipmentType"
        courierCode:
          type: string
        courierName:
          type: string
        trackingNumber:
          type: string
        dispatchedAt:
          type: string
          nullable: true
    ReshipClaimResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ReshipClaimData"
    UserStatus:
      type: string
      enum: [PENDING_ONBOARDING, ACTIVE, SUSPENDED, WITHDRAWN]
      description: "계정 상태. BE UserStatus enum 이름이 그대로 직렬화된다"
    AdminRosterSummary:
      type: object
      required: [userId, nickname, status, joinedAt, isSelf]
      properties:
        userId:
          type: integer
          format: int64
        nickname:
          type: string
          nullable: true
          description: "온보딩 전 계정이면 null로 온다 — 화면이 식별자로 쓸 수 없다"
        status:
          $ref: "#/components/schemas/UserStatus"
        joinedAt:
          type: string
          description: >-
            가입 시각(users.created_at), 오프셋 없는 LocalDateTime. **승격 시각이 아니다** —
            승격 시각 컬럼이 없어 계약 초안의 promotedAt이 이 필드로 바뀌었다
        isSelf:
          type: boolean
          description: "요청자(JWT sub) 자신의 행. 자기 역할 변경은 서버가 403 errorCode 30014로 막는다"
    AdminRosterListData:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminRosterSummary"
        totalCount:
          type: integer
          format: int64
    AdminRosterListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminRosterListData"
    PromoteAdminRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          format: int64
          description: "승격할 계정의 내부 숫자 id. 누락은 400 errorCode 90001"
    AdminApplicationSummary:
      type: object
      required: [applicationId, status, businessType, businessName, representativeName, submittedAt]
      description: >-
        목록 행. 사업자등록번호·전화번호는 목록 응답에 아예 없다(상세에만 사업자등록번호가 있다).
        화면에 신청인 이름을 보일 때는 상호명이 없으면 대표자명으로 접는다 — 서버 승인 로직이
        스토어명을 정할 때 쓰는 폴백과 같은 규칙이다
      properties:
        applicationId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        businessType:
          $ref: "#/components/schemas/BusinessType"
        businessName:
          type: string
          nullable: true
        representativeName:
          type: string
          nullable: true
        submittedAt:
          type: string
          nullable: true
          description: "제출 시각(오프셋 없는 LocalDateTime). 제출 전이면 null"
    AdminApplicationListData:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminApplicationSummary"
        totalCount:
          type: integer
          format: int64
          description: "status를 주지 않으면 DRAFT·CANCELLED까지 포함한 전체 건수다"
    AdminApplicationListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminApplicationListData"
    AdminApplicationDocument:
      type: object
      required: [documentType, uploadedAt, downloadUrl]
      properties:
        documentType:
          type: string
          description: "SellerDocumentType 값(서버가 문자열로 직렬화). 한국어 라벨은 응답에 없다"
        uploadedAt:
          type: string
          description: "서류 행의 갱신 시각 — 교체하면 같은 행을 갱신하므로 최신 업로드 시각이다"
        downloadUrl:
          type: string
          description: >-
            S3 presigned GET이고 유효기간이 5분이다 — 캐시된 상세로 몇 분 뒤 열면 403이므로
            서류 열기는 상세 재조회 흐름이어야 한다
    AdminApplicationReview:
      type: object
      required: [decision, rejectionReason, reviewedAt]
      properties:
        decision:
          type: string
          enum: [APPROVED, REJECTED]
          description: "심사 결정. 실제로 적재되는 값은 승인·반려 둘뿐이다"
        rejectionReason:
          type: string
          nullable: true
        reviewedAt:
          type: string
    AdminPreviousApplication:
      type: object
      required: [applicationId, status, decidedAt]
      properties:
        applicationId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        decidedAt:
          type: string
          nullable: true
    AdminApplicationDetail:
      type: object
      required: [applicationId, status, businessType, businessName, businessRegNo, corpRegNo, representativeName, telesalesNumber, bankCode, accountNumber, accountHolder, appliedAt, submittedAt, decidedAt, rejectionReason, documents, reviews, previousApplications]
      description: >-
        심사에 필요한 원본을 마스킹 없이 평문으로 준다(계약) — 화면 마스킹은 클라이언트 책임이다.
        전화번호 필드는 없다(telesalesNumber는 통신판매업 신고번호이고 전화번호가 아니다)
      properties:
        applicationId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        businessType:
          $ref: "#/components/schemas/BusinessType"
        businessName:
          type: string
          nullable: true
        businessRegNo:
          type: string
          nullable: true
          description: "사업자등록번호 평문"
        corpRegNo:
          type: string
          nullable: true
          description: "법인등록번호 평문"
        representativeName:
          type: string
          nullable: true
          description: "대표자 실명 평문"
        telesalesNumber:
          type: string
          nullable: true
          description: "통신판매업 신고번호 — 전화번호가 아니다"
        bankCode:
          type: string
          nullable: true
        accountNumber:
          type: string
          nullable: true
          description: "복호화된 계좌번호 평문(의도된 계약). 암호 열이 비어 있으면 null"
        accountHolder:
          type: string
          nullable: true
        appliedAt:
          type: string
          description: "신청서 생성 시각 — 목록에는 없는 필드다"
        submittedAt:
          type: string
          nullable: true
        decidedAt:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
          description: >-
            status가 REJECTED가 아니면 DB에 값이 있어도 null로 온다. 직전 반려 사유는
            reviews의 마지막 REJECTED 항목에만 남는다
        documents:
          type: array
          items:
            $ref: "#/components/schemas/AdminApplicationDocument"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/AdminApplicationReview"
          description: "심사 이력, id 오름차순"
        previousApplications:
          type: array
          items:
            $ref: "#/components/schemas/AdminPreviousApplication"
          description: >-
            같은 사업자등록번호의 과거 신청에서 자기 행을 뺀 id 내림차순. 사업자등록번호가
            없으면 빈 배열이고, 상태 필터가 없어 DRAFT도 섞인다
    AdminApplicationDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AdminApplicationDetail"
    RejectAdminSellerApplicationRequest:
      type: object
      properties:
        reason:
          type: string
          nullable: true
          maxLength: 500
          description: >-
            반려 사유. 500자 초과는 요청 본문 검증 단계에서 걸려 핸들러에 닿기도 전에
            400 errorCode 90001이 된다. 길이가 통과한 뒤 공백·누락이면 서버가 빈 문자열로 바꿔
            400 errorCode 10102가 되는데, 이 검사는 상태 가드보다 뒤에 돌기 때문에 이미 결정된
            신청에 빈 사유로 반려하면 400이 아니라 409 errorCode 10101이 앞선다
    SnsPetResult:
      type: object
      required: [breedLabel, birthYearMonth]
      properties:
        breedLabel:
          type: string
        birthYearMonth:
          type: string
          nullable: true
          pattern: '^\d{4}-\d{2}$'
          description: "생년월(yyyy-MM). 없으면 null(FE는 품종만 표시)"
    SnsPetSummaryResult:
      type: object
      required: [breedLabel, activePetCount]
      description: "목록 행의 펫 요약. 대표 펫 품종과 ACTIVE 펫 수(대표 포함)"
      properties:
        breedLabel:
          type: string
        activePetCount:
          type: integer
          minimum: 1
    SnsProfileResult:
      type: object
      required: [publicId, nickname, profileImageUrl, bio, pets, postCount, followerCount, followingCount, isMe, following, blockedByMe, mutedByMe]
      properties:
        publicId:
          type: string
        nickname:
          type: string
        profileImageUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
          maxLength: 150
          description: "비었거나 blockedByMe=true면 null"
        pets:
          type: array
          nullable: true
          description: "대표 펫부터 ACTIVE 펫 전체. 없으면 빈 배열, blockedByMe=true면 null"
          items:
            $ref: "#/components/schemas/SnsPetResult"
        postCount:
          type: integer
          format: int64
          nullable: true
        followerCount:
          type: integer
          format: int64
          nullable: true
        followingCount:
          type: integer
          format: int64
          nullable: true
        isMe:
          type: boolean
        following:
          type: boolean
        blockedByMe:
          type: boolean
        mutedByMe:
          type: boolean
    SnsProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SnsProfileResult"
    SnsUserItemResult:
      type: object
      required: [publicId, nickname, profileImageUrl, petSummary, isMe, following]
      description: "팔로워, 팔로잉 목록의 사용자 행"
      properties:
        publicId:
          type: string
        nickname:
          type: string
        profileImageUrl:
          type: string
          nullable: true
        petSummary:
          allOf:
            - $ref: "#/components/schemas/SnsPetSummaryResult"
          nullable: true
          description: "펫이 없으면 null"
        isMe:
          type: boolean
        following:
          type: boolean
    SnsUserPageResult:
      type: object
      required: [items, totalCount, nextCursor, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SnsUserItemResult"
        totalCount:
          type: integer
          format: int64
          nullable: true
          description: "팔로워, 팔로잉 목록은 항상 null"
        nextCursor:
          type: string
          nullable: true
        hasNext:
          type: boolean
    SnsUserPageResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SnsUserPageResult"
    SnsRelationItemResult:
      type: object
      required: [publicId, nickname, profileImageUrl, createdAt]
      description: "차단, 뮤트 관리 목록의 행"
      properties:
        publicId:
          type: string
        nickname:
          type: string
        profileImageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          description: "차단 또는 뮤트한 시각. ISO LocalDateTime(KST, 오프셋 없음)"
    SnsRelationPageResult:
      type: object
      required: [items, totalCount, nextCursor, hasNext]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SnsRelationItemResult"
        totalCount:
          type: integer
          format: int64
          nullable: true
          description: "첫 페이지에만, 이후 null"
        nextCursor:
          type: string
          nullable: true
        hasNext:
          type: boolean
    SnsRelationPageResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SnsRelationPageResult"
    ProductInquiryCategory:
      type: string
      description: "상품 문의 유형"
      enum:
        - PRODUCT
        - DELIVERY
        - CLAIM
        - ETC
    ProductInquiryStatus:
      type: string
      description: >-
        상품 문의 상태. RECEIVED가 화면의 '답변 대기'다 — 서버 어휘가 '접수'라 PENDING이 아니다.
        WITHDRAWN은 구매자가 질문을 거둬간 것이고 셀러 목록에는 내려오지 않는다
      enum:
        - RECEIVED
        - ANSWERED
        - WITHDRAWN
    SellerInquiryStatusFilter:
      type: string
      description: >-
        셀러 목록의 상태 탭. 도메인 상태(ProductInquiryStatus)와 값이 다른 이유 — 철회된 문의는
        셀러 목록에 아예 나오지 않으므로 고를 수 있는 값이 아니다
      enum:
        - RECEIVED
        - ANSWERED
    SellerInquiryAnswer:
      type: object
      description: "셀러 답변. 문의당 최대 한 건이고 수정 경로가 없다"
      required: [content, answeredAt]
      properties:
        content:
          type: string
        answeredAt:
          type: string
    SellerInquiryMetrics:
      type: object
      description: >-
        화면 상단 지표 3종. **탭·유형·검색어와 무관한 셀러 전체 범위**이고 철회된 문의는 세지 않는다.
        overdue는 서버가 저장한 answerDueAt으로 판정한 값이라 화면이 다시 계산하면 안 된다
      required: [pending, overdue, total]
      properties:
        pending:
          type: integer
          format: int64
          description: "답변 대기(RECEIVED) 건수"
        overdue:
          type: integer
          format: int64
          description: "답변 대기 중 답변 기한을 넘긴 건수"
        total:
          type: integer
          format: int64
          description: "답변 대기 + 답변 완료 건수(철회 제외)"
    SellerInquirySummary:
      type: object
      description: >-
        셀러가 받은 문의 한 행. `authorMasked`는 서버가 닉네임 첫 글자만 남긴 값이고 원문 닉네임은
        내려오지 않는다. `productId`는 접수 시점에 복사한 상품 공개 식별자라 상품이 내려가도 남는다
      required:
        [inquiryId, productId, productName, category, title, content, authorMasked, secret, status,
         askedAt, answerDueAt, overdue, answer]
      properties:
        inquiryId:
          type: string
          description: "문의 공개 식별자(ULID 26자)"
        productId:
          type: string
          description: "상품 공개 식별자(접수 시점 복사본)"
        productName:
          type: string
          description: "접수 시점 상품명 복사본"
        category:
          $ref: "#/components/schemas/ProductInquiryCategory"
        title:
          type: string
        content:
          type: string
          description: "비밀글도 셀러에게는 본문이 그대로 내려온다(답변 당사자)"
        authorMasked:
          type: string
          description: "마스킹된 작성자 표시명(예: 김**). 닉네임이 없으면 '익명'"
        secret:
          type: boolean
          description: "비밀글 — 작성자와 이 셀러만 본문을 읽는다"
        status:
          $ref: "#/components/schemas/ProductInquiryStatus"
        askedAt:
          type: string
        answerDueAt:
          type: string
          description: "서버가 접수 시점에 계산한 답변 기한(영업일 2일, 주말 제외)"
        overdue:
          type: boolean
          description: "미답변 상태로 기한을 넘겼는지 — 서버 판정 결과다"
        answer:
          allOf:
            - $ref: "#/components/schemas/SellerInquiryAnswer"
          nullable: true
    SellerInquiryListData:
      type: object
      required: [inquiries, metrics, totalCount, page, size, totalPages, hasNext]
      properties:
        inquiries:
          type: array
          items:
            $ref: "#/components/schemas/SellerInquirySummary"
        metrics:
          $ref: "#/components/schemas/SellerInquiryMetrics"
        totalCount:
          type: integer
          format: int64
          description: "필터를 모두 반영한 건수 — metrics와 기준이 다르다"
        page:
          type: integer
        size:
          type: integer
        totalPages:
          type: integer
        hasNext:
          type: boolean
    SellerInquiryListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerInquiryListData"
    AnswerInquiryRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: "공백만이면 400 errorCode 120105, 2000자 초과면 400 errorCode 120106"
    AnswerInquiryData:
      type: object
      required: [inquiryId, status, answeredAt]
      properties:
        inquiryId:
          type: string
        status:
          $ref: "#/components/schemas/ProductInquiryStatus"
        answeredAt:
          type: string
    AnswerInquiryResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AnswerInquiryData"
  parameters:
    SnsPublicId:
      name: publicId
      in: path
      required: true
      description: "사용자 공개 ID(ULID). 형식 검증 없이 찾지 못하면 404 130000"
      schema:
        type: string
    SnsCursor:
      name: cursor
      in: query
      required: false
      description: "이전 응답의 nextCursor. 목록 종류·주인·검색어에 묶이고 어긋나면 400 90002"
      schema:
        type: string
    SnsSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    SnsNickname:
      name: nickname
      in: query
      required: false
      description: "닉네임 부분 일치. 서버가 trim + NFC 정규화하고 검색어로는 400을 내지 않는다"
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
