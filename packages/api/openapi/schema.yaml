        termId:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/TermType"
        isRequired:
          type: boolean
          description: "필수 약관 여부. true면 동의 제출 시 isAgreed=true로 포함해야 한다"
        version:
          type: string
        title:
          type: string
        body:
          type: string
          description: "약관 본문(원문)"
        effectiveAt:
          type: string
          description: "시행일시(ISO-8601)"
    TermListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TermItem"
    SubmitConsentsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: "활성 약관 전체. 필수는 isAgreed=true, 선택은 실제 체크값(true/false)"
          items:
            type: object
            required: [termId, isAgreed]
            properties:
              termId:
                type: integer
                format: int64
              isAgreed:
                type: boolean
    NicknameCheckData:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
          description: "사용 가능 여부. 본인 현재 닉네임도 true"
    NicknameCheckResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/NicknameCheckData"
    NicknameRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
    SendPhoneCodeRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          description: "^01[016789]-?\\d{3,4}-?\\d{4}$ — 하이픈 유무 모두 허용. 위반 400 errorCode 90001"
    ConfirmPhoneCodeRequest:
      type: object
      required: [phoneNumber, code]
      properties:
        phoneNumber:
          type: string
          description: "발송 때 보낸 번호와 같아야 한다 — 불일치는 코드 오류와 함께 30005로 통합"
        code:
          type: string
          description: "6자리 숫자(^\\d{6}$). 형식 위반 400 errorCode 90001"
    PhoneCodeSent:
      type: object
      required: [expiresInSeconds, resendCooldownSeconds]
      properties:
        expiresInSeconds:
          type: integer
          description: "인증번호 유효시간(초, 현재 180). FE 만료 타이머의 원천 — 하드코딩 금지"
        resendCooldownSeconds:
          type: integer
          description: "재발송 쿨다운(초, 현재 60). FE 재발송 타이머의 원천 — 하드코딩 금지"
    PhoneCodeSentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PhoneCodeSent"
    # 내 정보. 8필드는 항상 존재하고(키 고정), PENDING_ONBOARDING이면 프로필 계열이 전부 null이라 값만 nullable이다.
    UserMe:
      type: object
      required: [status, nickname, profileImageUrl, profileImageKey, bio, email, phoneNumber, isPhoneVerified]
      properties:
        status:
          type: string
          description: "계정 상태 — PENDING_ONBOARDING | ACTIVE | SUSPENDED | WITHDRAWN. 닉네임 설정 완료 후 ACTIVE"
        nickname:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
          description: "표시용 URL. 서버가 조립해 내려준다"
        profileImageKey:
          type: string
          nullable: true
          description: "스토리지 키. 프로필 수정에서 사진을 유지하려면 이 값을 그대로 되돌려 보낸다(URL 역파싱 금지)"
        bio:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
          description: "마스킹 표시용"
        phoneNumber:
          type: string
          nullable: true
          description: "인증 전 null, 인증 후 서버 마스킹 표시용(예: 010-****-5678)"
        isPhoneVerified:
          type: boolean
    UserMeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserMe"
    UpdateProfileRequest:
      type: object
      required: [nickname, bio, profileImageKey]
      description: "전체 교체 — 세 필드를 항상 보낸다. bio·profileImageKey가 null이면 값이 지워진다."
      properties:
        nickname:
          type: string
          description: "NFC 정규화 후 ^[가-힣a-zA-Z0-9]{2,12}$. 위반 400 errorCode 30002, 중복 409 errorCode 30001"
        bio:
          type: string
          nullable: true
          maxLength: 150
          description: "자기소개. 150자 초과 400 errorCode 90001. 비우려면 null"
        profileImageKey:
          type: string
          nullable: true
          description: "유지할 기존 키 또는 새 tmp 키. null이면 사진 제거"
    SubmitInquiryRequest:
      type: object
      required: [inquiryType, replyEmail, content]
      properties:
        inquiryType:
          type: string
          enum: [ACCOUNT, ORDER_PAYMENT, DELIVERY_CLAIM, SELLER_PRODUCT, SERVICE_ETC]
          description: "문의 유형"
        replyEmail:
          type: string
          format: email
          description: "답변받을 이메일. 형식 위반 400 INVALID_REQUEST"
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: "문의 내용. 1~2000자"
    SubmitInquiryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, createdAt]
          properties:
            status:
              type: string
              description: "접수 상태. RECEIVED"
            createdAt:
              type: string
              description: "접수 시각 ISO-8601"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
