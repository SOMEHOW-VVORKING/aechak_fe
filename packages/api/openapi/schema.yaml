openapi: "3.0.3"
info:
  title: "Aechak API"
  description: "Backend OpenAPI spec — 백엔드 컨트롤러와 수동 동기화한다"
  version: "0.0.1"
# 경로 작성 규칙: /api/v1 접두 없이 쓴다 — axios 인스턴스 baseURL(client.ts)이 접두를 담당하므로
# 여기 경로에 접두를 넣으면 /api/v1이 두 번 붙는다. servers의 /api/v1은 문서 정확성용(orval은 무시).
servers:
  - url: "http://localhost:8080/api/v1"
    description: "Local development"
  - url: "https://api.aechak.com/api/v1"
    description: "Production"
paths:
  /health:
    get:
      summary: "Health check"
      operationId: "healthCheck"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
  /breeds:
    get:
      summary: "품종 목록 조회"
      description: "종별 품종 목록(가나다순, 종별 '세상에 하나뿐인 믹스'/'기타'가 마지막). 인증 필요(비로그인 401 errorCode 20005) — PENDING_ONBOARDING 유저 허용."
      operationId: "getBreeds"
      security:
        - bearerAuth: []
      parameters:
        - name: species
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Species"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedListResponse"
  /delivery-addresses:
    get:
      summary: "배송지 목록 조회"
      description: "본인 배송지만. 기본 배송지가 최상단, 그 아래는 최신 수정순."
      operationId: "getDeliveryAddresses"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAddressListResponse"
    post:
      summary: "배송지 추가"
      description: "최대 10개(초과 422 errorCode 30120). isDefault=true면 기존 기본은 자동 해제."
      operationId: "addDeliveryAddress"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDeliveryAddressRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddDeliveryAddressResponse"
  /delivery-addresses/{addressId}:
    patch:
      summary: "배송지 수정"
      description: "전체 객체 전송. isDefault=true면 기본 지정(기존 기본 해제), false/생략이면 기본 상태 유지."
      operationId: "updateDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryAddressRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDeliveryAddressResponse"
    delete:
      summary: "배송지 삭제"
      description: "기본 배송지 삭제 시 남은 것 중 최신이 자동 승격 — 승격된 id를 응답으로 준다(없으면 null)."
      operationId: "deleteDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDeliveryAddressResponse"
  /delivery-addresses/{addressId}/default:
    patch:
      summary: "기본 배송지 지정"
      description: "지정 건만 기본이 되고 나머지는 자동 해제(서버 소유 유일성)."
      operationId: "setDefaultDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetDefaultDeliveryAddressResponse"
  /categories:
    get:
      summary: "카테고리 트리 조회"
      description: "대>중>소(depth<=3) 재귀 카테고리 트리. 인증 필요(SCRUM-106 SecurityConfig 기준 permitAll 아님, 비로그인 401)."
      operationId: "getCategories"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /products:
    get:
      summary: "상품 목록 조회(커서 페이지네이션)"
      description: "카테고리/정렬/커서 기반 상품 목록. 비로그인 허용(permitAll). category는 categoryId이며 해당 카테고리와 직계 하위(1단계) 상품을 매칭한다(전체 하위 트리 아님)."
      operationId: "getProducts"
      parameters:
        - name: category
          in: query
          required: false
          description: "categoryId 필터"
          schema:
            type: integer
            format: int64
        - name: sort
          in: query
          required: false
          description: "정렬(기본 latest)"
          schema:
            $ref: "#/components/schemas/ProductSort"
        - name: cursor
          in: query
          required: false
          description: "다음 페이지 커서(이전 응답의 nextCursor)"
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /products/{productId}:
    get:
      summary: "상품 상세 조회"
      description: "상품 상세(permitAll, 비로그인 허용). 로그인 시 principal로 isLiked 계산, 비로그인은 false. 미존재/노출불가 productId는 404."
      operationId: "getProductDetail"
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailEnvelope"
        "404":
          description: "존재하지 않는 상품"
  /products/{productId}/options:
    get:
      summary: "상품 옵션 조회"
      description: "옵션 그룹 + 옵션 조합(조합별 추가금/재고/품절). 미존재 productId는 404."
      operationId: "getProductOptions"
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOptionsEnvelope"
        "404":
          description: "존재하지 않는 상품"
components:
  schemas:
    Species:
      type: string
      enum: [DOG, CAT]
    BreedResponse:
      type: object
      required: [breedId, label]
      properties:
        breedId:
          type: integer
          format: int64
        label:
          type: string
    BreedListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BreedResponse"
    DeliveryAddressResponse:
      type: object
      required: [addressId, receiverName, contactNumber, zipCode, baseAddress, isDefault]
      properties:
        addressId:
          type: integer
          format: int64
        receiverName:
          type: string
        contactNumber:
          type: string
        zipCode:
          type: string
        baseAddress:
          type: string
        detailAddress:
          type: string
          nullable: true
        deliveryMemo:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        isDefault:
          type: boolean
    DeliveryAddressListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [addresses, totalCount]
          properties:
            addresses:
              type: array
              items:
                $ref: "#/components/schemas/DeliveryAddressResponse"
            totalCount:
              type: integer
    AddDeliveryAddressRequest:
      type: object
      required: [receiverName, contactNumber, zipCode, baseAddress, detailAddress]
      properties:
        receiverName:
          type: string
        contactNumber:
          type: string
          description: "휴대폰 번호. 구분자(공백·하이픈·점·괄호)는 서버가 제거하고 숫자만 저장한다(^(010\\d{8}|01[16789]\\d{7,8})$)"
        zipCode:
          type: string
          description: "5자리 숫자"
        baseAddress:
          type: string
        detailAddress:
          type: string
        deliveryMemo:
          type: string
        label:
          type: string
        isDefault:
          type: boolean
          description: "생략=false"
    UpdateDeliveryAddressRequest:
      $ref: "#/components/schemas/AddDeliveryAddressRequest"
    AddDeliveryAddressResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [addressId, isDefault, totalCount]
          properties:
            addressId:
              type: integer
              format: int64
            isDefault:
              type: boolean
            totalCount:
              type: integer
    UpdateDeliveryAddressResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [addressId, isDefault]
          properties:
            addressId:
              type: integer
              format: int64
            isDefault:
              type: boolean
    SetDefaultDeliveryAddressResponse:
      $ref: "#/components/schemas/UpdateDeliveryAddressResponse"
    DeleteDeliveryAddressResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            promotedDefaultAddressId:
              type: integer
              format: int64
              nullable: true
              description: "기본 삭제로 자동 승격된 배송지 id — 승격 없으면 null"
    CategoryResponse:
      type: object
      required: [categoryId, name, iconUrl, sortOrder, children]
      properties:
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        iconUrl:
          type: string
          nullable: true
        sortOrder:
          type: integer
        children:
          type: array
          items:
            $ref: "#/components/schemas/CategoryResponse"
    CategoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CategoryResponse"
    ProductSort:
      type: string
      enum: [latest, price_asc]
      default: latest
    SaleStatus:
      type: string
      enum: [ON_SALE, OUT_OF_STOCK, SUSPENDED, ENDED]
    ProductSummaryResponse:
      type: object
      required: [productId, name, sellerName, thumbnailImageKey, regularPrice, discountPrice, discountRate, saleStatus, averageRating, reviewCount]
      properties:
        productId:
          type: string
        name:
          type: string
        sellerName:
          type: string
        thumbnailImageKey:
          type: string
          nullable: true
        regularPrice:
          type: integer
          format: int64
        discountPrice:
          type: integer
          format: int64
          nullable: true
        discountRate:
          type: integer
          nullable: true
        saleStatus:
          $ref: "#/components/schemas/SaleStatus"
        averageRating:
          type: number
          format: double
          nullable: true
        reviewCount:
          type: integer
    ProductListData:
      type: object
      required: [products, totalCount, nextCursor, hasNext]
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummaryResponse"
        totalCount:
          type: integer
          nullable: true
        nextCursor:
          type: string
          nullable: true
        hasNext:
          type: boolean
    ProductListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ProductListData"
    ProductImage:
      type: object
      required: [imageType, storageKey, sortOrder]
      properties:
        imageType:
          type: string
        storageKey:
          type: string
        sortOrder:
          type: integer
    ProductShipping:
      type: object
      required: [baseShippingFee, freeShippingThreshold]
      properties:
        baseShippingFee:
          type: integer
          format: int64
        freeShippingThreshold:
          type: integer
          format: int64
          nullable: true
    ProductSeller:
      type: object
      required: [storeName, profileImageKey]
      properties:
        storeName:
          type: string
        profileImageKey:
          type: string
          nullable: true
    ProductReviewSummary:
      type: object
      required: [reviewCount, averageRating]
      properties:
        reviewCount:
          type: integer
        averageRating:
          type: number
          format: double
          nullable: true
    ProductCategory:
      type: object
      required: [categoryId, name, depth]
      properties:
        categoryId:
          type: integer
          format: int64
        name:
          type: string
        depth:
          type: integer
    ProductDetailResponse:
      type: object
      required: [productId, name, description, representativeImageKey, images, regularPrice, discountPrice, discountRate, saleStatus, shipping, seller, review, categories, isLiked]
      properties:
        productId:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        representativeImageKey:
          type: string
          nullable: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        regularPrice:
          type: integer
          format: int64
        discountPrice:
          type: integer
          format: int64
          nullable: true
        discountRate:
          type: integer
          nullable: true
        saleStatus:
          $ref: "#/components/schemas/SaleStatus"
        shipping:
          $ref: "#/components/schemas/ProductShipping"
        seller:
          $ref: "#/components/schemas/ProductSeller"
        review:
          $ref: "#/components/schemas/ProductReviewSummary"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/ProductCategory"
        isLiked:
          type: boolean
    ProductDetailEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ProductDetailResponse"
    OptionValue:
      type: object
      required: [optionValueId, name, sortOrder]
      properties:
        optionValueId:
          type: integer
          format: int64
        name:
          type: string
        sortOrder:
          type: integer
    OptionGroup:
      type: object
      required: [optionGroupId, name, sortOrder, values]
      properties:
        optionGroupId:
          type: integer
          format: int64
        name:
          type: string
        sortOrder:
          type: integer
        values:
          type: array
          items:
            $ref: "#/components/schemas/OptionValue"
    OptionCombination:
      type: object
      required: [optionCombinationId, name, additionalPrice, optionValueIds, remainingStock, soldOut]
      properties:
        optionCombinationId:
          type: integer
          format: int64
        name:
          type: string
        additionalPrice:
          type: integer
          format: int64
        optionValueIds:
          type: array
          items:
            type: integer
            format: int64
        remainingStock:
          type: integer
          format: int64
          nullable: true
        soldOut:
          type: boolean
    ProductOptionsResponse:
      type: object
      required: [optionGroups, optionCombinations]
      properties:
        optionGroups:
          type: array
          items:
            $ref: "#/components/schemas/OptionGroup"
        optionCombinations:
          type: array
          items:
            $ref: "#/components/schemas/OptionCombination"
    ProductOptionsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ProductOptionsResponse"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
