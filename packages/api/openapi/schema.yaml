openapi: "3.0.3"
info:
  title: "Aechak API"
  description: "Backend OpenAPI spec — 백엔드 컨트롤러와 수동 동기화한다"
  version: "0.0.1"
# 경로 작성 규칙: /api/v1 접두 없이 쓴다 — axios 인스턴스 baseURL(client.ts)이 접두를 담당하므로
# 여기 경로에 접두를 넣으면 /api/v1이 두 번 붙는다. servers의 /api/v1은 문서 정확성용(orval은 무시).
servers:
  - url: "http://localhost:8080/api/v1"
    description: "Local development"
  - url: "https://api.aechak.com/api/v1"
    description: "Production"
paths:
  /health:
    get:
      summary: "Health check"
      operationId: "healthCheck"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
  /breeds:
    get:
      summary: "품종 목록 조회"
      description: "종별 품종 목록(가나다순, 종별 '세상에 하나뿐인 믹스'/'기타'가 마지막). 인증 필요(비로그인 401 errorCode 20004) — PENDING_ONBOARDING 유저 허용."
      operationId: "getBreeds"
      security:
        - bearerAuth: []
      parameters:
        - name: species
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Species"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedListResponse"
  /delivery-addresses:
    get:
      summary: "배송지 목록 조회"
      description: "본인 배송지만. 기본 배송지가 최상단, 그 아래는 최신 수정순."
      operationId: "getDeliveryAddresses"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAddressListResponse"
    post:
      summary: "배송지 추가"
      description: "최대 10개(초과 422 errorCode 30500). isDefault=true면 기존 기본은 자동 해제."
      operationId: "addDeliveryAddress"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDeliveryAddressRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddDeliveryAddressResponse"
  /delivery-addresses/{addressId}:
    patch:
      summary: "배송지 수정"
      description: "전체 객체 전송. isDefault=true면 기본 지정(기존 기본 해제), false/생략이면 기본 상태 유지."
      operationId: "updateDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDeliveryAddressRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateDeliveryAddressResponse"
    delete:
      summary: "배송지 삭제"
      description: "기본 배송지 삭제 시 남은 것 중 최신이 자동 승격 — 승격된 id를 응답으로 준다(없으면 null)."
      operationId: "deleteDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteDeliveryAddressResponse"
  /delivery-addresses/{addressId}/default:
    patch:
      summary: "기본 배송지 지정"
      description: "지정 건만 기본이 되고 나머지는 자동 해제(서버 소유 유일성)."
      operationId: "setDefaultDeliveryAddress"
      security:
        - bearerAuth: []
      parameters:
        - name: addressId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetDefaultDeliveryAddressResponse"
  /categories:
    get:
      summary: "카테고리 트리 조회"
      description: "대>중>소(depth<=3) 재귀 카테고리 트리. 인증 필요(SCRUM-106 SecurityConfig 기준 permitAll 아님, 비로그인 401)."
      operationId: "getCategories"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
  /products:
    get:
      summary: "상품 목록 조회(커서 페이지네이션)"
      description: "카테고리/정렬/커서 기반 상품 목록. 비로그인 허용(permitAll). category는 categoryId이며 해당 카테고리와 직계 하위(1단계) 상품을 매칭한다(전체 하위 트리 아님)."
      operationId: "getProducts"
      parameters:
        - name: category
          in: query
          required: false
          description: "categoryId 필터"
          schema:
            type: integer
            format: int64
        - name: sort
          in: query
          required: false
          description: "정렬(기본 latest)"
          schema:
            $ref: "#/components/schemas/ProductSort"
        - name: cursor
          in: query
          required: false
          description: "다음 페이지 커서(이전 응답의 nextCursor)"
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /search/products:
    get:
      summary: "키워드 상품 검색(커서 페이지네이션)"
      description: "상품명·셀러명 키워드 검색. 비로그인 허용하며 로그인 사용자의 첫 페이지 검색은 최근 검색어로 기록한다."
      operationId: "searchProducts"
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sort
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProductKeywordSearchSort"
        - name: minPrice
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: minRating
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: category
          in: query
          required: false
          description: "중분류 categoryId"
          schema:
            type: integer
            format: int64
        - name: freeShipping
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: excludeSoldOut
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /search/keywords:
    get:
      summary: "최근·추천 검색어 조회"
      operationId: "getSearchKeywords"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchKeywordsEnvelope"
  /search/recent-keywords:
    delete:
      summary: "최근 검색어 전체 삭제"
      operationId: "deleteAllRecentKeywords"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "No Content"
  /search/recent-keywords/{id}:
    delete:
      summary: "최근 검색어 단건 삭제"
      operationId: "deleteRecentKeyword"
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: "No Content"
  /products/{productId}:
    get:
      summary: "상품 상세 조회"
      description: "상품 상세. 인증 필요(permitAll 매처가 /products 정확 일치라 하위 경로는 비로그인 401). principal로 isLiked를 계산한다. 미존재/노출불가 productId는 404."
      operationId: "getProductDetail"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailEnvelope"
        "404":
          description: "존재하지 않는 상품"
  /products/{productId}/options:
    get:
      summary: "상품 옵션 조회"
      description: "옵션 그룹 + 옵션 조합(조합별 추가금/재고/품절). 인증 필요(상세와 동일, permitAll 아님). 미존재 productId는 404."
      operationId: "getProductOptions"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductOptionsEnvelope"
        "404":
          description: "존재하지 않는 상품"
  /products/{productId}/like:
    post:
      summary: "상품 찜하기"
      description: "상품을 찜 목록에 추가한다(멱등 — 이미 찜한 상품도 201). 미존재 productId는 404 errorCode 40000."
      operationId: "likeProduct"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: "Created(본문 없음)"
        "404":
          description: "존재하지 않는 상품(errorCode 40000)"
    delete:
      summary: "상품 찜 해제"
      description: "상품을 찜 목록에서 제거한다(멱등 — 찜하지 않은 상품도 204)."
      operationId: "unlikeProduct"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "No Content(본문 없음)"
  /files/presigned-url:
    post:
      summary: "업로드 presigned URL 발급"
      description: >-
        발급받은 url에 파일을 PUT하고, 돌려받은 key를 도메인 API(펫 등록·수정 등)에 실어 보낸다.
        키는 tmp 영역이고 도메인 API가 정식 위치로 옮긴다. 지원 형식은 purpose별로 다르다.
      operationId: "issuePresignedUrl"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssuePresignedUrlRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUrlResponse"
  /users/me:
    get:
      summary: "내 정보 조회"
      description: >-
        로그인 사용자의 프로필. PENDING_ONBOARDING이면 nickname·profileImageUrl·profileImageKey·bio가
        모두 null이다. profileImageKey는 프로필 수정에서 사진을 유지할 때 그대로 되돌려 보낼 원본 키다(역파싱 금지).
      operationId: "getMe"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"
  /users/me/liked-products:
    get:
      summary: "내 찜 목록 조회(커서 페이지네이션)"
      description: "로그인 사용자의 찜한 상품 목록. 품절도 saleStatus로 노출하며 자동 삭제하지 않는다. 상품 목록과 동일한 ProductListResponse."
      operationId: "getLikedProducts"
      security:
        - bearerAuth: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: "다음 페이지 커서(이전 응답의 nextCursor)"
          schema:
            type: string
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          description: "유효하지 않은 커서(errorCode 90002)"
  /users/me/profile:
    put:
      summary: "프로필 수정"
      description: >-
        부분 수정이 아니라 전체 교체다 — nickname·bio·profileImageKey 세 필드를 항상 보낸다.
        bio·profileImageKey에 null을 보내면 값이 지워진다. 사진을 유지하려면 조회에서 받은 profileImageKey를
        그대로 되돌려 보내고, 새 사진은 presigned로 받은 tmp 키를 보낸다. ACTIVE 전용(PENDING 접근은 403 errorCode 20006).
        닉네임 형식 위반은 400 errorCode 30002, 중복은 409 errorCode 30001, 동시 수정 충돌은 409 errorCode 90003.
      operationId: "updateProfile"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"
  /users/me/pets:
    get:
      summary: "내 펫 프로필 목록 조회"
      description: "본인 펫만(소프트 삭제 제외). 대표 펫이 최상단, 그 아래는 등록순. 온보딩 미완료 계정은 403 errorCode 20006."
      operationId: "getPets"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PetProfileListResponse"
    post:
      summary: "펫 프로필 등록"
      description: >-
        종·이름·품종은 필수, 생년월·체중·사진은 선택. 회원당 최대 10마리(초과 시 422 errorCode 30600).
        첫 펫은 isDefault 값과 무관하게 대표로 저장된다. isDefault=true면 기존 대표는 서버가 해제한다.
      operationId: "registerPet"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPetProfileRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPetProfileResponse"
  /users/me/pets/{petId}:
    put:
      summary: "펫 프로필 수정"
      description: >-
        부분 수정이 아니라 전체 객체 전송이다 — 유지할 값도 그대로 실어 보내야 하고,
        profileImageKey를 빼면 기존 사진이 지워진다. species는 수정 대상이 아니다.
        타인 펫은 403 errorCode 30602, 없는 펫은 404 errorCode 30601.
      operationId: "updatePet"
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePetProfileRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdatePetProfileResponse"
    delete:
      summary: "펫 프로필 삭제"
      description: >-
        소프트 삭제. 대표 펫을 지우면 남은 펫 중 가장 최근 등록·수정 건이 대표로 올라가고 그 id를 돌려준다.
      operationId: "deletePet"
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePetProfileResponse"
  /users/me/pets/{petId}/default:
    patch:
      summary: "대표 펫 지정"
      description: "기존 대표는 서버가 해제한다. 바뀐 필드만 돌려주므로 전체가 필요하면 목록을 재조회한다."
      operationId: "setDefaultPet"
      security:
        - bearerAuth: []
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetDefaultPetResponse"
  /users/me/points:
    get:
      summary: "내 적립금 잔액 조회"
      description: "원 단위 적립금 잔액(0 이상 정수). ACTIVE 전용 — 온보딩 미완료(PENDING) 계정이 부르면 403 errorCode 20006, 유저 없음은 404 errorCode 30000. 내역(히스토리)은 범위 밖으로 잔액만 내려준다."
      operationId: "getPointBalance"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PointBalanceResponse"
  /terms:
    get:
      summary: "활성 약관 목록 조회"
      description: >-
        가입/온보딩 화면이 그리는 활성 약관 전체(필수·선택 혼합). 인증 필요(비로그인 401 errorCode 20004) —
        PENDING_ONBOARDING 유저 허용. isRequired가 true인 약관은 동의 제출 시 모두 isAgreed=true여야 한다.
      operationId: "getTerms"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TermListResponse"
  /users/me/consents:
    post:
      summary: "약관 동의 제출(온보딩)"
      description: >-
        활성 약관에 대한 동의를 한 번에 제출한다. 활성 필수 약관은 전부 isAgreed=true로 포함해야 하고,
        선택(마케팅)은 true/false 모두 수집해 보낸다. items가 비었거나 termId가 중복이면 400 errorCode 90001,
        비활성/미지 termId면 400 errorCode 30400, 필수 동의가 누락/false면 403 errorCode 30300,
        이미 ACTIVE 계정이면 409 errorCode 30004. 성공은 204 No Content(빈 바디).
      operationId: "submitConsents"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitConsentsRequest"
      responses:
        "204":
          description: "No Content"
  /users/nickname/check:
    get:
      summary: "닉네임 가용성 확인(UX 보조)"
      description: >-
        닉네임 중복·형식을 미리 확인한다. 본인 현재 닉네임은 available=true. NFC 정규화 후
        완성형 한글·영문·숫자 2~12자가 아니면 400 errorCode 30002, 파라미터 누락은 400 errorCode 90001.
        보조 판정일 뿐이며 최종 중복 판정은 PUT /users/me/nickname의 409 errorCode 30001이다.
      operationId: "checkNickname"
      security:
        - bearerAuth: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicknameCheckResponse"
  /users/me/nickname:
    put:
      summary: "닉네임 설정·온보딩 완료 전이"
      description: >-
        닉네임을 확정하며 PENDING_ONBOARDING → ACTIVE로 전이한다(PENDING 전용). 응답 status는 ACTIVE.
        필수 동의가 미완이면 403 errorCode 30300, 형식 위반은 400 errorCode 30002,
        중복은 409 errorCode 30001(커밋 시점 최종 판정), 이미 ACTIVE면 409 errorCode 30004,
        유저 없음은 404 errorCode 30000.
      operationId: "setNickname"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NicknameRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"
  /users/me/phone/verifications:
    post:
      summary: "휴대폰 인증번호 발송"
      description: >-
        휴대폰 점유 인증 시작 — 재발송은 같은 EP 재호출. ACTIVE 전용(PENDING 접근은 403 errorCode 20006).
        응답의 expiresInSeconds/resendCooldownSeconds가 FE 타이머의 원천이다(수치 하드코딩 금지 — 서버 계약).
        번호 형식 위반은 400 errorCode 90001, 재발송 쿨다운은 429 errorCode 30006,
        일 발송 상한 초과는 429 errorCode 30008, SMS 벤더 발송 실패는 502 errorCode 30007.
      operationId: "sendPhoneCode"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendPhoneCodeRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneCodeSentResponse"
  /users/me/phone/verifications/confirm:
    post:
      summary: "휴대폰 인증번호 확인"
      description: >-
        발송된 인증번호를 대조해 점유 인증을 완료하고, 변경 후 내 정보를 반환한다
        (phoneNumber는 서버 마스킹 표시용, isPhoneVerified=true). 다른 계정이 점유 중이던 번호는
        서버가 점유를 이전하므로 별도의 중복 에러는 없다. 코드·번호 불일치는 400 errorCode 30005(의도적 미구분),
        만료(저장 코드 없음)는 400 errorCode 30009, 입력 횟수 초과는 429 errorCode 30010 —
        30009/30010 모두 재발송으로만 복구된다(30010은 코드 소각).
      operationId: "confirmPhoneCode"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPhoneCodeRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"
  /inquiries:
    post:
      summary: "앱 서비스 문의 접수"
      description: "로그인 사용자의 앱 서비스 문의를 접수한다(RECEIVED). 형식/필수 위반 400 INVALID_REQUEST, 미인증 401."
      operationId: "submitInquiry"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInquiryRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitInquiryResponse"
components:
  schemas:
    Species:
      type: string
      enum: [DOG, CAT]
    PetStatus:
      type: string
      enum: [ACTIVE, DELETED]
    RegisterPetProfileRequest:
      type: object
      required: [name, breedId]
      properties:
        name:
          type: string
          maxLength: 50
        breedId:
          type: integer
          format: int64
          description: "breeds 마스터의 id. 종이 일치하지 않으면 400 errorCode 30700"
        birthYearMonth:
          type: string
          nullable: true
          pattern: '^\d{4}(-(0[1-9]|1[0-2]))?$'
          description: >-
            생년월. 생월을 모르면 연도만(YYYY) 보내도 되고 서버가 1월로 맞춰 저장한다.
            미래는 400 errorCode 30604. 완전히 모르면 보내지 않는다.
          example: "2022-04"
        weight:
          type: number
          nullable: true
          description: "체중 kg. 0.1~200.0, 소수점 첫째자리까지"
        profileImageKey:
          type: string
          nullable: true
          description: >-
            업로드 presigned로 받은 tmp 키. 서버가 정식 위치로 옮기고 옮겨진 키를 저장한다.
            타인이 발급받은 키는 403 errorCode 100002.
        isDefault:
          type: boolean
          nullable: true
          description: "대표 펫 지정. 생략하면 false로 접힌다"
    PetProfileResponse:
      type: object
      required: [petId, species, name, breedId, breedLabel, isDefault, status, version]
      properties:
        petId:
          type: integer
          format: int64
        species:
          $ref: "#/components/schemas/Species"
        name:
          type: string
        breedId:
          type: integer
          format: int64
        breedLabel:
          type: string
        birthYearMonth:
          type: string
          nullable: true
        weight:
          type: number
          nullable: true
        profileImageKey:
          type: string
          nullable: true
          description: "스토리지 키. 수정은 전체 객체 전송이라 사진을 유지하려면 이 값을 되돌려 보낸다"
        profileImageUrl:
          type: string
          nullable: true
          description: "표시용 URL. 서버가 조립해 내려준다"
        isDefault:
          type: boolean
        status:
          $ref: "#/components/schemas/PetStatus"
        version:
          type: integer
          description: "낙관적 락 버전. 수정 API가 쓸 값이고 목록·수정 응답이 유일한 획득 경로다"
    UploadPurpose:
      type: string
      enum: [USER_PROFILE, PET_PROFILE]
    IssuePresignedUrlRequest:
      type: object
      required: [purpose, contentType]
      properties:
        purpose:
          $ref: "#/components/schemas/UploadPurpose"
        contentType:
          type: string
          description: "image/png, image/jpeg, image/webp (프로필 사진). 허용 밖이면 400 errorCode 100000"
          example: "image/png"
    PresignedUrlResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url, key]
          properties:
            url:
              type: string
              description: "이 URL에 파일을 PUT한다. 유효시간이 있다"
            key:
              type: string
              description: "도메인 API에 실어 보낼 tmp 키"
    UpdatePetProfileRequest:
      type: object
      required: [name, breedId]
      description: "전체 객체 전송 — 유지할 값도 다 보낸다. species는 없다(등록 시 확정)"
      properties:
        name:
          type: string
          maxLength: 50
        breedId:
          type: integer
          format: int64
        birthYearMonth:
          type: string
          nullable: true
          pattern: '^\d{4}(-(0[1-9]|1[0-2]))?$'
        weight:
          type: number
          nullable: true
        profileImageKey:
          type: string
          nullable: true
          description: "새 tmp 키 또는 유지할 기존 키. 빼면 사진이 지워진다"
        isDefault:
          type: boolean
          nullable: true
          description: "true면 대표로 전환. false·생략은 변경 없음 — 대표 해제는 다른 펫 지정으로만"
        version:
          type: integer
          nullable: true
          description: "목록·수정 응답에서 받은 값. 보내면 그 사이 선점됐는지 검사하고 어긋나면 409 errorCode 90003"
    # 성공 응답은 서버가 ApiResponse로 data에 감싸므로 봉투까지 스키마에 담는다(배송지·품종과 동일).
    UpdatePetProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PetProfileResponse"
    DeletePetProfileResponse:
