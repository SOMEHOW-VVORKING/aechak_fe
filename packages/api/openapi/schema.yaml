              schema:
                $ref: "#/components/schemas/SnsRelationPageResponse"
  /seller-applications:
    get:
      summary: "내 입점 신청 현황"
      description: >-
        인증 주체의 신청서 1건(경로 식별자 없음). ACTIVE 전용(PENDING 접근은 403 errorCode 20006).
        신청 이력이 없으면 404 errorCode 10100 — 화면은 이를 '신규 신청 폼'으로 해석한다.
      operationId: "getSellerApplication"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerApplicationResponse"
    post:
      summary: "입점 신청 임시저장(폼+서류 일괄 upsert)"
      description: >-
        필수는 businessType뿐 — 필수성 검증은 제출(10105)로 일원화하고 여기선 형식만 본다.
        폼 필드는 전체 덮어쓰기라 생략(null)하면 저장된 값이 지워진다(항상 폼 전체를 실을 것).
        서류만 부분 upsert — 요청에 포함한 종류만 등록/교체되고 미포함 종류는 유지된다.
        REJECTED 상태에서 부르면 자동으로 DRAFT로 재개(reopen)돼 응답 status가 DRAFT로 온다.
        휴대폰 미인증은 403 errorCode 10103(선행 조건 — 가장 먼저 검사), 이미 셀러면 409 errorCode 10001,
        저장 불가 상태는 409 errorCode 10101, 동시 최초 신청 충돌은 409 errorCode 10104.
        서류 tmpKey 승격 실패는 404 errorCode 100001(미업로드)/403 100002(소유자 불일치)/400 100003(용도 불일치).
        사업자등록번호 형식(하이픈 허용 10자리+국세청 체크섬) 위반은 400 errorCode 90001.
      operationId: "saveSellerApplicationDraft"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveSellerApplicationDraftRequest"
      responses:
        "200":
          description: "저장된 신청서 전체 — 화면은 이 응답으로 재구성한다"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerApplicationResponse"
  /seller-applications/submit:
    post:
      summary: "입점 신청 제출"
      description: >-
        DRAFT만 제출 가능 — 그 외 상태는 409 errorCode 10101, 신청서가 없으면 404 errorCode 10100.
        REJECTED에서 재제출하려면 saveDraft(자동 reopen → DRAFT)를 먼저 거쳐야 한다.
        유형별 필수 정보·서류 미비는 400 errorCode 10105 — 부족 목록은 message 문자열 한 줄로만
        오고 구조화 필드가 없다(클라이언트도 유형별 필수 표를 자체 보유할 것). 성공은
        204 No Content(빈 바디)이며 이후 수정·서류가 잠긴다.
      operationId: "submitSellerApplication"
      security:
        - bearerAuth: []
      responses:
        "204":
          description: "No Content"
  /sellers/couriers:
    get:
      summary: "택배사 마스터 목록"
      description: >-
        활성 택배사만 내려주고 정렬은 서버가 courierName 오름차순·courierCode 오름차순으로
        고정한다(클라이언트가 다시 정렬하지 않는다). courierCode는 courier_masters의 PK이고
        시드가 대문자(CJ·LOTTE·HANJIN·LOGEN·POST)다 — 송장 등록·회수 송장·교환 재발송·배송
        정책이 모두 이 코드를 정확 일치로 찾으므로, 응답 값을 그대로 보내야 한다(소문자는
        404 errorCode 50303). trackingFormatPattern은 송장번호 정규식이며 미정이면 null이다
        (필드 자체가 빠지지 않는다). 셀러에 종속되지 않는 공용 마스터라 셀러 자격을 보지 않고
        로그인만 요구한다 — 미로그인은 401 errorCode 20004. 경로가 `/sellers`로 시작하는 것은
        셀러센터 호스트로 보내기 위한 것이고(호스트 분기는 경로 접두로만 판정된다) `me`가 없다.
      operationId: "getSellerCouriers"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourierListResponse"
  /sellers/me/orders:
    get:
      summary: "셀러 주문 목록"
      description: >-
        셀러센터(seller 모듈) 전용. 커서가 아니라 오프셋 페이지네이션(page·size)이고 정렬은
        서버가 주문일 내림차순으로 고정한다. `status`는 응답 상태값(OrderStatus enum 이름)이
        아니라 **화면 세그먼트 어휘**다 — 한 세그먼트가 상태 여러 개를 묶는다(아래
        SellerOrderStatusFilter). 미지 세그먼트는 400 errorCode 90001이다.
        `orderedFrom`·`orderedTo`는 yyyy-MM-dd이고 서버가 [from 00:00, to+1일 00:00) 반개구간으로
        바꿔 상한 날짜를 통째로 포함한다. from > to면 400 errorCode 90001이다.
        빈 값 파라미터는 키째 빼서 보낼 것 — 서버가 미입력이 아니라 형식 오류로 거절하는 자리가 있다.
        수령인명·연락처는 **마스킹되지 않은 평문**으로 온다(마스킹은 화면 책임).
      operationId: "getSellerOrders"
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SellerOrderStatusFilter"
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
          description: "주문번호·수령인·구매자 닉네임 부분 일치. 서버가 trim하고 빈 값은 미적용"
        - name: orderedFrom
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: "주문일 하한(yyyy-MM-dd). 형식 위반은 400 errorCode 90001"
        - name: orderedTo
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: "주문일 상한(yyyy-MM-dd). 서버가 to+1일 00:00 반개구간으로 바꿔 통째로 포함한다"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerOrderListResponse"
  /sellers/me/orders/{orderPublicId}:
    get:
      summary: "셀러 주문 상세"
      description: >-
        주문 단위 필드는 목록 행과 같고 `items`(품목 라인)가 더 붙는다. 남의 주문과 없는 주문을
        같은 404 errorCode 50000으로 가린다(주문번호 존재 여부를 노출하지 않는다).
      operationId: "getSellerOrderDetail"
      security:
        - bearerAuth: []
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            type: string
          description: "orders.public_id(ULID). 내부 숫자 id는 경로·응답에 노출되지 않는다"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerOrderDetailResponse"
  /sellers/me/orders/{orderPublicId}/accept:
    post:
      summary: "발주 확인"
      description: >-
        PAID → PREPARING. 전이의 심판은 조건부 UPDATE라 경합에서 진 쪽은 409 errorCode 50004다
        (PAID가 아닌 모든 상태도 같은 코드). 본문 없음, 응답 본문 없음(204).
      operationId: "acceptSellerOrder"
      security:
        - bearerAuth: []
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "No Content"
  /sellers/me/orders/{orderPublicId}/shipment:
    post:
      summary: "송장 등록"
      description: >-
        **경로는 단수 `shipment`다**(복수는 404). PREPARING 또는 DISPATCH_PENDING에서만 받고
        그 밖은 409 errorCode 50005다. PREPARING에서 부르면 DISPATCH_PENDING을 거쳐 2단 전이해
        최종 상태가 SHIPPING이다. 이미 최초 배송 행이 있으면 409 errorCode 50302이므로 **송장
        정정 경로가 아니다** — 등록은 한 번뿐이다. `courierCode`는 택배사 마스터
        (GET /sellers/couriers)의 값을 그대로 보낸다(미존재는 404 errorCode 50303), 송장번호가
        택배사 패턴과 어긋나면 400 errorCode 50304다.
      operationId: "registerSellerOrderShipment"
      security:
        - bearerAuth: []
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShipmentRegisterRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShipmentRegisterResponse"
  /sellers/me/orders/{orderPublicId}/delivery-complete:
    post:
      summary: "배송 완료 처리"
      description: >-
        SHIPPING → DELIVERED. 구매확정 기한(`purchaseConfirmDueAt`)이 이때 부여된다. 거절 순서는
        최초 배송 행 조회 → `deliveredAt` 확인 → 조건부 UPDATE다 — 배송 행이 없으면
        404 errorCode 50300, 이미 배송완료거나 상태가 SHIPPING이 아니어서 전이가 실패하면
        **둘 다** 409 errorCode 50301이다(50002가 아니다). 본문 없음, 응답 본문 없음(204).
      operationId: "completeSellerOrderDelivery"
      security:
        - bearerAuth: []
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "No Content"
  /sellers/me/products:
    get:
      summary: "셀러 상품 목록"
      description: >-
        셀러센터(seller 모듈) 전용. 오프셋 페이지네이션이며 커서가 아니다. 공개 카탈로그와 달리
        노출 조건을 걸지 않아 미승인·판매중지 상품도 전부 보인다. 조회 권한은 ACTIVE·PAUSED·
        WITHDRAWAL_REQUESTED 셀러이고 그 밖은 403 errorCode 40006. 형식 오류는 전부
        400 errorCode 90001이고 message에 필드별 사유가 실린다 — 빈 값(?stock=)도 미입력이
        아니라 형식 오류로 거절되므로 값이 없는 파라미터는 키째 빼서 보낼 것.
      operationId: "getSellerProducts"
      security:
        - bearerAuth: []
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
          description: "상품명 부분 일치(대소문자 무시). trim 후 빈 값이면 미적용"
        - name: saleStatus
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SaleStatus"
          description: >-
            반복 파라미터로 보낸다(?saleStatus=A&saleStatus=B). 미지 값은 400 errorCode 90001
            message "saleStatus: 지원하지 않는 값입니다."
        - name: inspectionStatus
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/InspectionStatus"
          description: "saleStatus와 같은 규칙. 미지 값은 400 errorCode 90001"
        - name: category
          in: query
          schema:
            type: integer
            format: int64
          description: "활성 카테고리면 깊이에 상관없이 하위 카테고리까지 포함해 조회한다"
        - name: createdFrom
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: "등록일 하한(yyyy-MM-dd). 형식 위반은 400 errorCode 90001"
        - name: createdTo
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: >-
            등록일 상한(yyyy-MM-dd). 서버가 [from 00:00, to+1일 00:00) 반개구간으로 바꿔
            상한 날짜를 통째로 포함한다. from > to면 400 errorCode 90001
        - name: stock
          in: query
          schema:
            type: string
            enum: [in_stock, sold_out]
          description: >-
            재고 있는 활성 조합의 존재 여부로 가른다 — 재고가 남아도 조합이 전부 비활성이면
            sold_out에 걸린다. 소문자만 받는다
        - name: sort
          in: query
          schema:
            type: string
            enum: [latest, price_asc, price_desc]
            default: latest
          description: "소문자만 받는다. 가격 정렬의 기준은 조회 시각의 할인 반영가다"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProductListResponse"
    post:
      summary: "셀러 상품 등록"
      description: >-
        등록 직후 상태는 재고와 무관하게 항상 saleStatus=ON_SALE, inspectionStatus=APPROVED,
        versionNo=1이다. 쓰기 권한은 ACTIVE 셀러뿐이고 그 밖은 403 errorCode 40004.
        카테고리는 활성 소분류(depth 3)만 받는다 — 중·대분류는 400 errorCode 40100,
        없는 카테고리는 404 errorCode 40101. 가격 범위 위반은 400 errorCode 40001,
        할인 기간 모순은 400 errorCode 40002, 이미지 장수 초과는 400 errorCode 40003,
        옵션 불변식 위반은 400 errorCode 40005(message에 사유), 재고 음수는 400 errorCode 40200,
        추가금 음수는 400 errorCode 40201. 이미지 키는 presigned로 받은 tmp 키를 싣는다 —
        타인 키는 403 errorCode 100002, 용도 불일치는 400 errorCode 100003, 미업로드는 404 errorCode 100001.
      operationId: "registerSellerProduct"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerProductRegisterRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProductRegisterResponse"
  /sellers/me/products/{productId}:
    get:
      summary: "셀러 상품 단건 조회"
      description: >-
        수정 폼 프리필 전용. 이미지 키는 지금 열려 있는 행(현재 버전)에서만 뽑고 종류별
        sortOrder 오름차순으로 내려오므로, 이 응답을 그대로 PUT 본문에 실어도 소유 증명에
        걸리지 않는다(닫힌 과거 키를 섞으면 403 errorCode 100002다). 옵션은 응답에 없다 —
        옵션/재고는 PUT의 대상이 아니고 별도 `GET /{productId}/options`가 담당한다.
        자격 게이트가 목록·옵션 조회와 갈린다: 이 조회만 활성 셀러 조건이라 정지·휴점·탈퇴신청
        셀러와 셀러 아닌 계정이 403 errorCode 40004이고(목록·옵션은 40006으로 휴점을 허용한다),
        저장(PUT)과 같은 조건이라 폼을 열어 준 셀러는 저장도 통과한다.
        없는 상품과 남의 상품은 같은 404 errorCode 40000이다(존재 여부를 가린다 — 같은 id의
        옵션 조회는 403 errorCode 40007을 주므로 API 전체의 은닉은 아니다).
        미로그인은 401 errorCode 20004.
      operationId: "getSellerProductDetail"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
          description: "상품 공개 식별자(ULID 26자). 내부 숫자 PK가 아니다"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProductDetailResponse"
    put:
      summary: "셀러 상품 정보 수정"
      description: >-
        옵션은 이 경로로 바꾸지 않는다(옵션 재고는 별도 PATCH). 이미지 목록은 전체 교체이고,
        빠진 행은 삭제되지 않고 직전 버전으로 닫힌다 — 순서만 바뀌면 행이 늘지 않고 정렬만 바뀐다.
        등록에 없는 검증이 하나 더 있다: additionalImageKeys·detailImageKeys 각 목록 안의
        키 중복을 400 errorCode 90001로 거절한다(두 목록을 넘나드는 중복은 허용).
        소유 증명 집합이 대표 이미지 키와 현재 열린 이미지 행으로 한정되므로, 과거 수정으로
        닫힌 키나 다른 상품의 정식 키를 실으면 403 errorCode 100002다.
        남의 상품은 404 errorCode 40000으로 가린다.
      operationId: "updateSellerProduct"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
          description: "상품 공개 식별자(ULID 26자). 내부 숫자 PK가 아니다"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProductUpdateResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerProductUpdateRequest"
  /sellers/me/products/{productId}/status:
    patch:
      summary: "셀러 상품 판매 상태 변경"
      description: >-
        셀러가 지정할 수 있는 값은 ON_SALE과 SUSPENDED뿐이다 — OUT_OF_STOCK·ENDED는
        400 errorCode 90001 message "판매중과 판매중지만 지정할 수 있습니다."
        현재 상태를 보지 않으므로 같은 값 재전송도 200이다. 재고 파생 전이가 같은 요청 안에서
        동기로 얹히기 때문에, 재고 없이 ON_SALE을 보내면 응답이 그 자리에서 OUT_OF_STOCK이다
        (재고가 없어도 SUSPENDED는 그대로 반영된다). 이 경로는 상품 버전을 남기지 않는다.
      operationId: "changeSellerProductSaleStatus"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerProductSaleStatusChangeRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProductSaleStatusChangeResponse"
  /sellers/me/products/{productId}/options:
    get:
      summary: "셀러 상품 옵션 조합 재고 조회"
      description: >-
        비활성 조합까지 포함하고 재고를 마스킹 없이 원값으로 준다. 정렬은 조합 id 오름차순이다.
        옵션 없이 등록한 상품은 name이 "기본"인 1행으로 온다. 여섯 엔드포인트 가운데 이것만
        남의 상품에 403 errorCode 40007을 주고(나머지 쓰기 경로는 404 errorCode 40000으로 가린다),
        조회 권한은 ACTIVE·PAUSED·WITHDRAWAL_REQUESTED 셀러다(그 밖은 403 errorCode 40006).
      operationId: "getSellerProductOptions"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerProductOptionsResponse"
  /sellers/me/products/{productId}/options/{combinationId}:
    patch:
      summary: "셀러 상품 옵션 조합 재고·판매 여부 변경"
      description: >-
        stockDelta와 isActive 중 적어도 하나를 보내야 하고, 둘 다 없으면 400 errorCode 90001
        message "재고 증감과 판매 여부 중 하나는 보내야 합니다." stockDelta는 0을 금지하고
        ±1000000 이내여야 한다. 응답 appliedStockDelta는 요청과 다를 수 있다 — 서버가 결과 재고를
        0 이상으로 자르고 실제 반영량만 돌려준다. isActive만 보내면 항상 0이다.
        응답에 상품 saleStatus가 없고 재고 파생 전환이 커밋 뒤 비동기로 일어나므로,
        품절 전환을 화면에 반영하려면 목록을 다시 조회해야 한다.
      operationId: "changeSellerProductOptionCombination"
      security:
        - bearerAuth: []
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: combinationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: >-
            옵션 조합의 내부 숫자 PK — 공개 식별자가 없으므로 옵션 조회 응답의
            optionCombinationId를 그대로 쓴다. 숫자가 아니면 400 errorCode 90001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SellerOptionCombinationChangeRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerOptionCombinationChangeResponse"
  /sellers/me/dashboard/summary:
    get:
      summary: "셀러센터 대시보드 집계"
      description: >-
        셀러센터(seller 모듈) 첫 화면이 한 번에 묻는 네 묶음 — 처리 대기 10지표, 정산 요약 3금액,
        상품 상태 4건수. 로그인 직후 랜딩이라 파라미터 없이 들어와도 200이고, 데이터가 없는 새 셀러도
        전부 0이다. 조회 권한은 ACTIVE·PAUSED·WITHDRAWAL_REQUESTED 셀러이고 그 밖은
        403 errorCode 10003(SUSPENDED·WITHDRAWN·셀러 아님). 미로그인은 401 errorCode 20004.

        **기간 축의 단위가 목록 필터와 다르다.** 여기 기간은 응답 기준 시각(`now`)을 끝으로 하는
        **시각 단위 반개구간**(`7d` = `[now-7일, now)`)이고, 주문·클레임 목록 필터
        (`orderedFrom`/`orderedTo`·`requestedFrom`/`requestedTo`)는 **날짜 단위**다(시작일 00:00 ~
        종료일 다음 날 00:00). 그래서 카드의 기간을 목록 필터로 정확히 재현할 수 없다 — 목록이 양쪽
        경계에서 더 넓게 잡는다. 카드에서 목록으로 넘어갈 때 **단계·상태 축만 넘기고 기간은 넘기지
        않으면** 어긋나지 않는다.

        지표의 기간 축은 주문 3지표가 주문일(`order_groups.created_at`), 클레임 6지표가
        요청일(`claims.requested_at`)이다. 정산 요약과 상품 상태는 기간 필터를 받지 않는 현재
        스냅샷이다.
      operationId: "getSellerDashboardSummary"
      security:
        - bearerAuth: []
      parameters:
        - name: period
          in: query
          schema:
            $ref: "#/components/schemas/SellerDashboardPeriod"
          description: >-
            생략하면 전체 기간(`all`)이다. 미지 값은 400 errorCode 90001
            message "period: 지원하지 않는 값입니다."
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerDashboardSummaryResponse"
  /sellers/me/settlements:
    get:
      summary: "셀러 정산 목록"
      description: >-
        셀러센터(seller 모듈) 전용. **주문 하나가 한 행이다** — 정산 원장은 주문품목당 1행이지만
        이 목록은 주문 단위로 접고 금액은 품목 합이다. 정렬은 구매확정일 최신순 고정이다.
        오프셋 페이지네이션이며 커서가 아니다. 취소된 정산 행은 집계에서 빠지고, 정산 행이
        전부 취소된 주문과 주문 행이 없는 정산 행은 목록·총건수에서 함께 빠진다.
        한 주문 안에서 상태가 갈리면 **덜 진행된 쪽으로 접히고 보류가 가장 세다**(보류 >
        대기 > 예정 > 완료) — 상태 필터를 걸어도 금액은 쪼개지 않고 주문 전체 합을 준다.
        자격은 활성·휴점 셀러이고(정지·탈퇴신청·비셀러는 403) 미인증은 401 errorCode 20004.
        형식 오류는 전부 400 errorCode 90001이다 — month가 `yyyy-MM`이 아니거나, status가
        네 어휘 밖이거나, size가 범위 밖일 때다. **값이 빈 파라미터는 키째 빼서 보낼 것.**
        배포된 OpenAPI 문서는 이 질의를 `request` 객체 하나로 그리지만(@ModelAttribute 렌더링
        결함) 실제 계약은 아래 평면 파라미터다 — BE 컨트롤러가 정답이다.
      operationId: "getSellerSettlements"
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: query
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: >-
            정산월(`yyyy-MM`, 구매확정일 기준). 생략하면 전체 조회다 — 화면의 '전체' 선택은
            이 파라미터를 보내지 않는 것으로 표현한다. 고를 수 있는 월은 `/months`가 준다
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SellerSettlementStatus"
          description: "생략하면 전체. 소문자 네 어휘만 받는다"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSettlementListResponse"
  /sellers/me/settlements/months:
    get:
      summary: "정산월 목록"
      description: >-
        월 필터가 고를 수 있는 정산월만 최신순으로 준다(정산 행이 있는 월뿐이다).
        비어 있으면 아직 정산 행이 없는 셀러다 — 화면은 '전체'만 남긴다.
      operationId: "getSellerSettlementMonths"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSettlementMonthsResponse"
  /sellers/me/settlements/{orderPublicId}:
    get:
      summary: "셀러 정산 상세"
      description: >-
        목록 행 클릭 시 열리는 건별 상세. 목록과 같은 요약 + 금액 분해 + 품목 내역이다.
        남의 정산은 403 errorCode 70003, 없는 주문번호와 정산이 전부 취소된 주문은
        404 errorCode 70002다. 금액 불변식은 요약 = 품목 내역의 합이고,
        `feeAmount = platformFeeAmount + pgFeeAmount`다(쿠폰 부담·환불 차감은 수수료가 아니다).
        `finalAmount`는 저장된 지급 예정액의 합이라 배송비가 더해지고 쿠폰 부담·환불 차감이
        빠진 값이다 — `productAmount - feeAmount`와 같지 않다.
      operationId: "getSellerSettlement"
      security:
        - bearerAuth: []
      parameters:
        - name: orderPublicId
          in: path
          required: true
          schema:
            type: string
          description: "주문 공개 식별자(ULID). 목록 행의 orderId를 그대로 쓴다"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerSettlementDetailResponse"
  /sellers/me/shipping-policy:
    get:
      summary: "셀러 배송 정책 조회"
      description: >-
        셀러센터(seller 모듈) 전용. 대상은 늘 인증 주체의 정책 1건이라 경로에 식별자가 없다.
        정책을 한 번도 저장하지 않은 셀러도 404가 아니라 컬럼 기본값(추가비·반품비·교환비 0원,
        avgDispatchDays 2, returnSameAsOrigin true)을 받는다. 자격 게이트는 **활성 셀러만**이라
        정지·휴점·탈퇴신청 셀러는 403 errorCode 10002, 셀러가 아닌 계정은 404 errorCode 10000,
        미인증은 401 errorCode 20004다(상품 목록이 휴점을 허용하는 것과 다르다).
        출고지 주소 3필드는 스토어 설정과 같은 컬럼(zipCode·roadAddress·detailAddress)이라
        두 화면이 같은 값을 본다. 반품지가 출고지와 같으면(returnSameAsOrigin=true) 반품지
        3필드는 저장되지 않아 null로 내려온다 — 화면이 출고지 값으로 채워 보여 줄 것.
      operationId: "getSellerShippingPolicy"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShippingPolicyResponse"
    put:
      summary: "셀러 배송 정책 저장"
      description: >-
        **전체 덮어쓰기** — 바디에서 뺀 선택 항목은 비운 것으로 본다(부분 수정이 아니다).
        성공은 204이고 응답 바디가 없다 — 저장 결과가 필요하면 다시 조회할 것.
        returnSameAsOrigin=true면 서버가 반품지 3필드를 무시하고 null로 저장한다.
        금액·발송일 검증은 도메인이 하고 위반은 전부 400 errorCode 10005다(음수, 기본 배송비·
        지역 추가비·반품비·교환비 1,000,000원 초과, 무료배송 기준 100,000,000원 초과,
        무료배송 기준 < 기본 배송비, avgDispatchDays가 1~7 밖). 길이 위반은 400 errorCode
        90001(shippingPolicyText 2000자, 우편번호 10자, 도로명·상세주소 255자, 택배사 코드 30자).
        defaultCourierCode는 `GET /sellers/couriers`가 준 대문자 코드를 그대로 보낸다 —
        없거나 비활성인 코드는 404 errorCode 50303이고, 셀러 게이트가 택배사 검증보다 앞선다.
      operationId: "updateSellerShippingPolicy"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShippingPolicyUpdateRequest"
      responses:
        "204":
          description: "No Content"
  /sellers/me/claims:
    get:
      summary: "셀러 클레임 목록"
      description: >-
        셀러센터(seller 모듈) 전용. 오프셋 페이지네이션이고 정렬은 claims.id 내림차순 고정이다
        (정렬 파라미터가 없다). 키워드 검색이 없다 — 주문번호로 찾는 입력을 만들면 안 된다.
        자격 게이트가 상품·주문보다 좁다: **조회까지 ACTIVE 셀러만** 통과하고(ClaimFacade가 모든
        경로를 isActiveSeller로 감싼다) 휴점·탈퇴신청 셀러는 목록 조회도 403 errorCode 50404다.
        형식 오류는 전부 400 errorCode 90001이고, 빈 값 파라미터(`?status=`·`?requestedFrom=`)는
        미입력이 아니라 형식 오류로 거절된다 — 값이 없는 파라미터는 키째 빼서 보낼 것.
        `counts`는 **유형 필터를 무시하고** 상태·단계·기간 필터만 반영한다(유형 탭 배지가 지금 고른
        탭과 무관해야 하기 때문) — 세 유형 키는 0이어도 빠지지 않는다.
      operationId: "getSellerClaims"
      security:
        - bearerAuth: []
      parameters:
        - name: claimType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ClaimType"
          description: >-
            반복 파라미터로 보낸다(?claimType=CANCEL&claimType=RETURN). 미지 값은 400 errorCode
            90001 message "claimType: 지원하지 않는 값입니다."
        - name: status
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ClaimStatus"
          description: "claimType과 같은 규칙. 축끼리는 AND, 한 축 안의 값끼리는 OR"
        - name: refundStatus
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/RefundStatus"
          description: "claimType과 같은 규칙"
        - name: pendingStage
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SellerClaimPendingStage"
          description: >-
            셀러가 아직 할 일이 남은 단계(SCRUM-278). 대시보드 처리 대기 집계와 **같은 판정**을 쓰므로
            카드에서 목록으로 넘어와도 두 숫자가 어긋나지 않는다. 상태 축만으로는 가를 수 없는 자리가
            있어 필요하다 — 회수 중(COLLECTING) 한 상태에 송장 등록 대기와 완료 처리 대기가 함께 들어
            있고, 목록 응답에는 그 둘을 가르는 collectionStartedAt이 없다
        - name: requestedFrom
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: >-
            요청일 하한(yyyy-MM-dd, 당일 00:00 포함). 네 자리 연도만 받는다 — 형식 위반은
            400 errorCode 90001 message "requestedFrom: 날짜 형식이 올바르지 않습니다. (YYYY-MM-DD)"
        - name: requestedTo
          in: query
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: >-
            요청일 상한(종료일 당일을 통째로 포함한다 — 서버가 다음 날 00:00 반개구간으로 바꾼다).
            from > to는 400 errorCode 90001
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "0부터. 음수는 400 errorCode 90001(서버가 보정하지 않는다)"
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: "1~100. 범위를 벗어나면 400 errorCode 90001(절삭하지 않는다)"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerClaimListResponse"
        "403":
          description: "ACTIVE 셀러가 아님(errorCode 50404)"
  /sellers/me/claims/{claimPublicId}:
    get:
      summary: "셀러 클레임 상세"
      description: >-
        목록 행 + 주문·수령자 + 대상 품목 + 진행 이력. 수령인명·연락처는 **복호 평문**이라 마스킹은
        화면이 한다(어드민 심사 API 선례와 통일). 이력에는 전용 테이블이 없어 클레임이 들고 있는 시각
        컬럼에서 조립하며, 목록에 없는 `COLLECTION_STARTED`가 여기서 드러난다 — 회수 중 클레임이
        송장 등록 대기인지 완료 처리 대기인지 가르는 유일한 응답 근거다. 남의 클레임·없는 클레임은
        모두 404 errorCode 50400이고, ACTIVE 셀러가 아니면 403 errorCode 50404다.
      operationId: "getSellerClaim"
      security:
        - bearerAuth: []
      parameters:
        - name: claimPublicId
          in: path
          required: true
          schema:
            type: string
          description: "클레임 공개 식별자(ULID 26자)"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerClaimDetailResponse"
        "404":
          description: "없는 클레임 또는 남의 클레임(errorCode 50400)"
  /sellers/me/claims/{claimPublicId}/approve:
    post:
      summary: "셀러 클레임 승인"
      description: >-
        상태만 바꾼다 — 환불 집행은 이 경로가 아니라 배치가 한다(승인 직후 refundStatus는 NONE이다).
        취소는 바로 APPROVED, 반품·교환은 COLLECTING(회수 대기)으로 간다. **반품비 부담 주체는 셀러가
        직접 지정한다** — 서버는 사유로 유도하지 않고 받은 값을 그대로 저장하며, 취소에서는 그 값을
        저장하지 않는다(Claim.approveBySeller가 CANCEL이면 건너뛴다). 이미 판단한 건은
        409 errorCode 50408, 상태가 맞지 않으면 409 errorCode 50402다.
      operationId: "approveSellerClaim"
      security:
        - bearerAuth: []
      parameters:
        - name: claimPublicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveClaimRequest"
      responses:
        "204":
          description: "No Content(본문 없음)"
        "409":
          description: "이미 처리됨(errorCode 50408) / 허용되지 않은 전이(errorCode 50402)"
  /sellers/me/claims/{claimPublicId}/reject:
    post:
      summary: "셀러 클레임 거부"
      description: >-
        거부 사유는 구매자에게 그대로 노출되므로 **빈 값을 받지 않는다** — 공백만 보내면
        400 errorCode 50405다(본문 자체를 생략해도 같다). 500자를 넘으면 400 errorCode 90001이고
        서버가 trim 후 500자로 자른다. 반품·교환 거부는 붙잡고 있던 주문품목을 주문 상태로 되돌린다.
      operationId: "rejectSellerClaim"
      security:
        - bearerAuth: []
      parameters:
        - name: claimPublicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectClaimRequest"
      responses:
        "204":
          description: "No Content(본문 없음)"
        "400":
          description: "거부 사유 누락(errorCode 50405)"
  /sellers/me/claims/{claimPublicId}/memo:
    patch:
      summary: "셀러 클레임 운영 메모"
      description: >-
        덮어쓰기다(병합이 아니다). null·공백을 보내면 메모를 지운다. 상태 전이와 무관해서 종결된
        클레임에도 쓸 수 있다. 500자 초과는 400 errorCode 90001. 구매자 응답에는 나가지 않는다.
      operationId: "updateSellerClaimMemo"
      security:
        - bearerAuth: []
      parameters:
        - name: claimPublicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClaimMemoRequest"
      responses:
        "204":
          description: "No Content(본문 없음)"
  /sellers/me/claims/{claimPublicId}/collection:
    post:
      summary: "반품·교환 회수 송장 등록"
      description: >-
        승인해 회수 대기(COLLECTING)로 넘어온 반품·교환만. 상태는 COLLECTING에 머물고 회수 시작
        시각만 남는다 — "물건을 받기 전에는 환불하지 않는다"의 근거다. 취소에 부르면
        409 errorCode 50409, 이미 등록했으면 409 errorCode 50302, 택배사 코드가 없으면
        404 errorCode 50303이다. courierCode는 `GET /sellers/couriers`가 준 대문자 코드를
        그대로 보낸다.
        **송장번호 형식은 이 경로가 검사하지 않는다** — `CourierMaster.validateTrackingNumber`를
        부르는 곳은 최초 발송(SellerOrderService)뿐이고 회수·재발송은 공백·길이(50자)만 본다.
        형식 위반(400 errorCode 50304)을 기대하지 말 것.
      operationId: "startSellerClaimCollection"
      security:
        - bearerAuth: []
      parameters:
        - name: claimPublicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartClaimCollectionRequest"
      responses:
        "204":
          description: "No Content(본문 없음)"
        "409":
          description: "회수 불가 상태(errorCode 50409) / 이미 등록(errorCode 50302)"
  /sellers/me/claims/{claimPublicId}/collection/complete:
    post:
      summary: "반품·교환 회수 완료"
      description: >-
        회수 송장이 등록된 건만. 이 전이로 상태가 APPROVED가 되고 반품 환불 집행이 그 뒤에만 일어난다
        (교환은 재발송이 남는다). 송장이 없거나 이미 완료했으면 409 errorCode 50409다. 본문이 없다.
      operationId: "completeSellerClaimCollection"
      security:
        - bearerAuth: []
      parameters:
        - name: claimPublicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: "No Content(본문 없음)"
        "409":
          description: "회수 진행 불가(errorCode 50409)"
  /sellers/me/claims/{claimPublicId}/reship:
    post:
      summary: "교환 재발송 송장 등록"
      description: >-
        회수가 끝난 교환(APPROVED·미종결)만. 환불이 없는 대신 이 송장 등록이 교환을 종결시킨다
        (resolvedAt이 찍힌다). 조건을 벗어나면 409 errorCode 50411, 이미 등록했으면
        409 errorCode 50302다. 응답은 201이고 등록된 송장을 돌려준다.
        회수와 같이 **송장번호 형식은 검사하지 않는다**(공백·길이 50자만 본다).
      operationId: "reshipSellerClaim"
      security:
        - bearerAuth: []
      parameters:
        - name: claimPublicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReshipClaimRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReshipClaimResponse"
        "409":
          description: "재발송 불가(errorCode 50411) / 이미 등록(errorCode 50302)"
  /sellers/me/inquiries:
    get:
      summary: "셀러가 받은 상품 문의 목록"
      description: >-
        셀러센터(seller 모듈) 전용. 접수 시점에 복사해 둔 sellerId로 잠그므로 **자기 상품에 온
        문의만** 나온다. 오프셋 페이지네이션이고 정렬은 문의 id 내림차순 고정이다(정렬 파라미터 없음).
        **철회(WITHDRAWN)된 문의는 어느 탭에도 나오지 않고 지표에도 세지 않는다** — 구매자가 질문을
        거둬간 것이라 status 필터로 고를 수도 없다(RECEIVED·ANSWERED 둘뿐).
        `metrics`는 **탭·유형·검색어를 무시하고** 셀러 전체 범위를 센다(탭을 눌러도 상단 지표가
        흔들리지 않아야 하기 때문). `overdue`와 `metrics.overdue`는 **서버가 저장한
        `answerDueAt`과 서버 시각으로 같은 규칙으로 판정한 결과**다 — 화면이 날짜를 빼서 다시 세면
        두 숫자가 어긋난다. 비밀글(`secret`)도 셀러는 답변 당사자라 본문이 그대로 내려온다.
        자격 게이트는 상품 조회와 같다: 정지·탈퇴 셀러는 403 errorCode 120112이고 휴점·탈퇴신청
        셀러는 받은 문의를 읽는다. 형식 오류는 전부 400 errorCode 90001이다.
      operationId: "getSellerInquiries"
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SellerInquiryStatusFilter"
          description: >-
            비우면 답변 대기와 답변 완료를 함께 돌려준다(화면의 '전체' 탭). 빈 값(`?status=`)은
            미입력이 아니라 형식 오류이므로 키째 빼서 보낼 것
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/ProductInquiryCategory"
          description: "비우면 전체 유형. 빈 값은 status와 같은 규칙"
        - name: keyword
          in: query
          schema:
            type: string
            maxLength: 100
          description: "문의 제목 또는 상품명 부분일치(대소문자 무시). 공백만이면 키째 뺄 것"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: "0부터. 음수는 400 errorCode 90001(서버가 보정하지 않는다)"
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: "1~100. 범위를 벗어나면 400 errorCode 90001(절삭하지 않는다)"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerInquiryListResponse"
        "403":
          description: "정지·탈퇴 셀러(errorCode 120112)"
  /sellers/me/inquiries/{inquiryId}/answer:
    post:
      summary: "상품 문의 답변 등록"
      description: >-
        **문의당 한 번만 받는다** — 이미 답변한 문의는 409 errorCode 120109이고 수정 경로가 없다
        (구매자가 이미 읽은 답변이 조용히 바뀌지 않게 한 결정). 철회된 문의는 409 errorCode 120114,
        남의 상품에 온 문의는 403 errorCode 120108, 없는 문의는 404 errorCode 120100이다.
        답변은 ACTIVE 셀러만 등록한다(정지·휴점 포함 그 외는 403 errorCode 120112) — 읽기보다
        게이트가 좁다. 응답은 201이고 바뀐 상태와 답변 시각을 돌려준다.
      operationId: "answerSellerInquiry"
      security:
        - bearerAuth: []
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
          description: "문의 공개 식별자(ULID 26자)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerInquiryRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerInquiryResponse"
        "400":
          description: >-
            공백만(errorCode 120105) / 2000자 초과(errorCode 120106). 둘 다 도메인이 던지는 코드가
            그대로 나온다 — 요청 DTO에 같은 제약을 거울로 두지 않기 때문이다
        "403":
          description: "남의 상품 문의(errorCode 120108) / ACTIVE 셀러 아님(errorCode 120112)"
        "404":
          description: "없는 문의(errorCode 120100)"
        "409":
          description: "이미 답변함(errorCode 120109) / 철회된 문의(errorCode 120114)"
  /admin/admins:
    get:
      summary: "어드민 관리자 명부 목록"
      description: >-
        어드민 콘솔(admin 모듈) 전용. 전 요청이 ADMIN 역할을 요구한다(미인증 401 errorCode 20004,
        비ADMIN 403 errorCode 20011). 정렬은 가입 순(userId 오름차순) 고정이고 오프셋
        페이지네이션이다. page/size 형식 오류는 서버가 보정한다(page<0→0, size는 1~100 절삭) —
        400을 내지 않는다. `nickname`은 온보딩 전 계정이면 null로 온다. `isSelf`는 요청자(JWT sub)
        자신의 행 표시이고 필드명이 그대로 직렬화된다. 가입 시각 필드명은 `promotedAt`이 아니라
        `joinedAt`(= users.created_at)이다 — 승격 시각 컬럼이 없어 BE가 이름을 바꿨고, 화면이
        이것을 승격 시각으로 표기하면 거짓말이 된다.
      operationId: "getAdminRoster"
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRosterListResponse"
    post:
      summary: "어드민 관리자 승격"
      description: >-
        성공은 204 No Content(본문 없음)다. **승격 직후 그 사람의 토큰에는 권한이 반영되지 않는다** —
        role은 로그인 시점 JWT 스냅샷이라 승격된 계정이 api에서 다시 로그인해야 ADMIN 토큰을 받는다.
        화면에 그 안내를 고정 문구로 둬야 한다(계약의 일부).
        400 errorCode 90001 — userId 누락(@Valid).
        404 errorCode 30000 USER_NOT_FOUND.
        409 errorCode 30012 USER_ALREADY_ADMIN.
        409 errorCode 30017 USER_NOT_PROMOTABLE — ACTIVE가 아닌 계정(정지·온보딩 미완). 계약 초안의
        30015가 아니고, P0-4 보고 시점의 500도 아니다(현재 develop에서 409/30017로 고정됐다).
        403 errorCode 30014 SELF_ROLE_CHANGE_NOT_ALLOWED — 자기 자신 승격. 강등 직후에도 옛 ADMIN
        토큰이 게이트를 통과하므로 자기 자격을 되돌리는 경로를 막는다.
      operationId: "promoteAdmin"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromoteAdminRequest"
      responses:
        "204":
          description: "No Content"
  /admin/admins/{userId}:
    delete:
      summary: "어드민 관리자 강등"
      description: >-
        성공은 204 No Content(본문 없음)이고 **멱등이다** — 이미 일반 회원이면 no-op도 204다.
        404 errorCode 30000 USER_NOT_FOUND.
        403 errorCode 30014 SELF_ROLE_CHANGE_NOT_ALLOWED — 자기 자신 강등.
        409 errorCode 30013 LAST_ADMIN_CANNOT_BE_DEMOTED — 관리자가 0명이 되는 강등. 0명이 되면
        어드민 전 EP가 20011로 막히고 복구 경로가 DB 직접 조작이나 기동 부트스트랩뿐이라 서버가 막는다.
        강등해도 이미 발급된 access(30분)·refresh(7일)는 만료까지 ADMIN으로 통과한다(토큰 무효화
        배선 없음) — 즉시 차단으로 설명하면 안 된다.
      operationId: "demoteAdmin"
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: "No Content"
  /admin/seller-applications:
    get:
      summary: "어드민 셀러 심사 목록"
      description: >-
        어드민 콘솔(admin 모듈) 전용이며 전 요청이 ADMIN 역할을 요구한다(권한 없음은
        403 errorCode 20011). 오프셋 페이지네이션이고 커서가 아니다. 정렬은 서버가
        제출일 내림차순·id 내림차순으로 고정하며 제출 전(submittedAt=null) 건은 뒤로 밀린다.
        status를 주지 않으면 DRAFT·CANCELLED까지 포함한 전체가 totalCount에 잡힌다.
        미지 status는 400 errorCode 90001 message "status: 잘못된 값입니다."
        page 음수는 0으로, size는 1~100으로 서버가 보정한다(거절하지 않는다).
      operationId: "getAdminSellerApplications"
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
          description: "대문자 enum 이름을 그대로 보낸다. 생략하면 전체"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationListResponse"
  /admin/seller-applications/{applicationId}:
    get:
      summary: "어드민 셀러 심사 상세"
      description: >-
        사업자등록번호·대표자명·계좌번호를 마스킹 없이 평문으로 내려준다(계약) — 화면 표시용
        마스킹은 클라이언트 책임이다. rejectionReason은 status가 REJECTED가 아니면 DB에 값이
        남아 있어도 null로 온다(직전 반려 사유는 reviews 배열의 마지막 REJECTED 항목에만 남는다).
        documents의 downloadUrl은 유효기간 5분짜리 presigned GET이므로, 상세 응답을 캐시해 두고
        몇 분 뒤 서류를 열면 403이 된다 — 서류 열기는 상세를 다시 조회하는 흐름이어야 한다.
        previousApplications는 같은 사업자등록번호의 과거 신청에서 자기 행을 뺀 id 내림차순이고,
        사업자등록번호가 없으면 빈 배열이다(상태 필터가 없어 DRAFT도 섞인다).
        없는 신청은 404 errorCode 10100.
      operationId: "getAdminSellerApplicationDetail"
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationDetailResponse"
  /admin/seller-applications/{applicationId}/approve:
    post:
      summary: "어드민 셀러 심사 승인"
      description: >-
        요청 본문·쿼리·멱등키 헤더가 없고 성공은 204 No Content(빈 바디)다 — data 봉투조차 없다.
        한 트랜잭션에서 신청 승인 전이와 심사 이력 누적, 셀러 개점(스토어명은 상호명이 없으면
        대표자명으로 접힌다), 정산계좌 검증 이관이 함께 일어난다.
        승인·반려가 가능한 상태는 SUBMITTED와 REVIEWING뿐이고, 그 밖은 409 errorCode 10101이다.
        동시 승인 두 건은 한쪽이 204, 다른 쪽이 409로 갈린다 — 낙관적 잠금 실패와 유니크 제약
        충돌도 모두 10101로 번역되므로, 클라이언트는 409를 받으면 errorCode 10101·90003을 같이
        "이미 처리되었거나 다른 운영자가 먼저 처리함"으로 다루고 목록을 다시 조회하면 된다.
        없는 신청은 404 errorCode 10100.
      operationId: "approveAdminSellerApplication"
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: "No Content"
  /admin/seller-applications/{applicationId}/reject:
    post:
      summary: "어드민 셀러 심사 반려"
      description: >-
        성공은 204 No Content(빈 바디)다. 사유는 500자 이하만 형식 검증으로 걸리고(초과는
        400 errorCode 90001 message "반려 사유는 500자 이하여야 합니다."), 공백·누락은 서버가
        빈 문자열로 바꿔 도메인에 넘겨 400 errorCode 10102가 된다.
        상태 가드가 사유 검사보다 먼저 실행되므로, 이미 결정된 신청에 빈 사유로 반려하면
        400이 아니라 409 errorCode 10101이다 — 클라이언트 분기는 이 우선순위를 따라야 한다.
        없는 신청은 404 errorCode 10100.
      operationId: "rejectAdminSellerApplication"
      security:
        - bearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectAdminSellerApplicationRequest"
      responses:
        "204":
          description: "No Content"
components:
  schemas:
    Species:
      type: string
      enum: [DOG, CAT]
    PetStatus:
      type: string
      enum: [ACTIVE, DELETED]
    RegisterPetProfileRequest:
      type: object
      required: [name, breedId]
      properties:
        name:
          type: string
          maxLength: 50
        breedId:
          type: integer
          format: int64
          description: "breeds 마스터의 id. 종이 일치하지 않으면 400 errorCode 30700"
        birthYearMonth:
          type: string
          nullable: true
          pattern: '^\d{4}(-(0[1-9]|1[0-2]))?$'
          description: >-
            생년월. 생월을 모르면 연도만(YYYY) 보내도 되고 서버가 1월로 맞춰 저장한다.
            미래는 400 errorCode 30604. 완전히 모르면 보내지 않는다.
          example: "2022-04"
        weight:
          type: number
          nullable: true
          description: "체중 kg. 0.1~200.0, 소수점 첫째자리까지"
        profileImageKey:
          type: string
          nullable: true
          description: >-
            업로드 presigned로 받은 tmp 키. 서버가 정식 위치로 옮기고 옮겨진 키를 저장한다.
            타인이 발급받은 키는 403 errorCode 100002.
        isDefault:
          type: boolean
          nullable: true
          description: "대표 펫 지정. 생략하면 false로 접힌다"
    PetProfileResponse:
      type: object
      required: [petId, species, name, breedId, breedLabel, isDefault, status, version]
      properties:
        petId:
          type: integer
          format: int64
        species:
          $ref: "#/components/schemas/Species"
        name:
          type: string
        breedId:
          type: integer
          format: int64
        breedLabel:
          type: string
        birthYearMonth:
          type: string
          nullable: true
        weight:
          type: number
          nullable: true
        profileImageKey:
          type: string
          nullable: true
          description: "스토리지 키. 수정은 전체 객체 전송이라 사진을 유지하려면 이 값을 되돌려 보낸다"
        profileImageUrl:
          type: string
          nullable: true
          description: "표시용 URL. 서버가 조립해 내려준다"
        isDefault:
          type: boolean
        status:
          $ref: "#/components/schemas/PetStatus"
        version:
          type: integer
          description: "낙관적 락 버전. 수정 API가 쓸 값이고 목록·수정 응답이 유일한 획득 경로다"
    UploadPurpose:
      type: string
      enum: [USER_PROFILE, PET_PROFILE, SELLER_DOCUMENT, REVIEW_IMAGE, PRODUCT]
    IssuePresignedUrlRequest:
      type: object
      required: [purpose, contentType]
      properties:
        purpose:
          $ref: "#/components/schemas/UploadPurpose"
        contentType:
          type: string
          description: >-
            프로필 사진(USER_PROFILE/PET_PROFILE)과 상품 이미지(PRODUCT)는 image/png·image/jpeg·image/webp,
            셀러 서류(SELLER_DOCUMENT)는 여기에 application/pdf까지. 허용 밖이면 400 errorCode 100000.
            발급받은 URL에 PUT할 때 Content-Type을 발급 때와 같게 보내야 한다(서명에 박혀 있다)
          example: "image/png"
    PresignedUrlResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [url, key]
          properties:
            url:
              type: string
              description: "이 URL에 파일을 PUT한다. 유효시간이 있다"
            key:
              type: string
              description: "도메인 API에 실어 보낼 tmp 키"
    UpdatePetProfileRequest:
      type: object
      required: [name, breedId]
      description: "전체 객체 전송 — 유지할 값도 다 보낸다. species는 없다(등록 시 확정)"
      properties:
        name:
          type: string
          maxLength: 50
        breedId:
          type: integer
          format: int64
        birthYearMonth:
          type: string
          nullable: true
          pattern: '^\d{4}(-(0[1-9]|1[0-2]))?$'
        weight:
          type: number
          nullable: true
        profileImageKey:
          type: string
          nullable: true
          description: "새 tmp 키 또는 유지할 기존 키. 빼면 사진이 지워진다"
        isDefault:
          type: boolean
          nullable: true
          description: "true면 대표로 전환. false·생략은 변경 없음 — 대표 해제는 다른 펫 지정으로만"
        version:
          type: integer
          nullable: true
          description: "목록·수정 응답에서 받은 값. 보내면 그 사이 선점됐는지 검사하고 어긋나면 409 errorCode 90003"
    # 성공 응답은 서버가 ApiResponse로 data에 감싸므로 봉투까지 스키마에 담는다(배송지·품종과 동일).
    UpdatePetProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PetProfileResponse"
    DeletePetProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          properties:
            promotedDefaultPetId:
              type: integer
              format: int64
              nullable: true
              description: "대표를 지워 승격이 일어났을 때만 값이 있다"
    SetDefaultPetResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [petId, isDefault]
          properties:
            petId:
              type: integer
              format: int64
            isDefault:
              type: boolean
    PetProfileListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [pets]
          properties:
            pets:
              type: array
              items:
                $ref: "#/components/schemas/PetProfileResponse"
    RegisterPetProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [petId, userId, species, name, breedId, breedLabel, isDefault, status]
          properties:
            petId:
              type: integer
              format: int64
            userId:
              type: integer
              format: int64
              description: "등록 응답에만 있다 — 조회는 /users/me 경로라 소유자가 자명해 생략한다"
            species:
              $ref: "#/components/schemas/Species"
            name:
              type: string
            breedId:
              type: integer
              format: int64
            breedLabel:
              type: string
            birthYearMonth:
              type: string
              nullable: true
            weight:
              type: number
              nullable: true
            profileImageKey:
              type: string
              nullable: true
            profileImageUrl:
              type: string
              nullable: true
            isDefault:
              type: boolean
            status:
              $ref: "#/components/schemas/PetStatus"
    BreedResponse:
      type: object
      required: [breedId, label]
      properties:
        breedId:
          type: integer
          format: int64
        label:
          type: string
    BreedListResponse:
      type: object
