openapi: "3.0.3"
info:
  title: "Aechak API"
  description: "Backend OpenAPI spec — 백엔드 컨트롤러와 수동 동기화한다"
  version: "0.0.1"
# 경로 작성 규칙: /api/v1 접두 없이 쓴다 — axios 인스턴스 baseURL(client.ts)이 접두를 담당하므로
# 여기 경로에 접두를 넣으면 /api/v1이 두 번 붙는다. servers의 /api/v1은 문서 정확성용(orval은 무시).
servers:
  - url: "http://localhost:8080/api/v1"
    description: "Local development"
  - url: "https://api.aechak.com/api/v1"
    description: "Production"
paths:
  /health:
    get:
      summary: "Health check"
      operationId: "healthCheck"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
  /breeds:
    get:
      summary: "품종 목록 조회"
      description: "종별 품종 목록(가나다순, 종별 '세상에 하나뿐인 믹스'/'기타'가 마지막). 인증 필요(비로그인 401 errorCode 20005) — PENDING_ONBOARDING 유저 허용."
      operationId: "getBreeds"
      security:
        - bearerAuth: []
      parameters:
        - name: species
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Species"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreedListResponse"
components:
  schemas:
    Species:
      type: string
      enum: [DOG, CAT]
    BreedResponse:
      type: object
      required: [breedId, label]
      properties:
        breedId:
          type: integer
          format: int64
        label:
          type: string
    BreedListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BreedResponse"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
