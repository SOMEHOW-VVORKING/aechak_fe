                $ref: "#/components/schemas/PhoneCodeSentResponse"
  /users/me/phone/verifications/confirm:
    post:
      summary: "휴대폰 인증번호 확인"
      description: >-
        발송된 인증번호를 대조해 점유 인증을 완료하고, 변경 후 내 정보를 반환한다
        (phoneNumber는 서버 마스킹 표시용, isPhoneVerified=true). 다른 계정이 점유 중이던 번호는
        서버가 점유를 이전하므로 별도의 중복 에러는 없다. 코드·번호 불일치는 400 errorCode 30005(의도적 미구분),
        만료(저장 코드 없음)는 400 errorCode 30009, 입력 횟수 초과는 429 errorCode 30010 —
        30009/30010 모두 재발송으로만 복구된다(30010은 코드 소각).
      operationId: "confirmPhoneCode"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmPhoneCodeRequest"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMeResponse"
  /inquiries:
    post:
      summary: "앱 서비스 문의 접수"
      description: "로그인 사용자의 앱 서비스 문의를 접수한다(RECEIVED). 형식/필수 위반 400 INVALID_REQUEST, 미인증 401."
      operationId: "submitInquiry"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitInquiryRequest"
      responses:
        "201":
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitInquiryResponse"
  # SNS-01 프로필과 관계 — 원천은 spec/contracts/sns.yaml(2026-10-21 contract 게이트 확정). 실패는 errorCode로 분기한다:
  # 130000(404 볼 수 없는 사용자) / 130001(403 내가 차단한 사용자) / 130100·130200·130300(400 자기 자신 차단·뮤트·팔로우).
