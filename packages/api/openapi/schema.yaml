          description: "적립금 잔액(원 단위, 0 이상 정수)"
    PointBalanceResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PointBalanceData"
    CartItemStatus:
      type: string
      description: "장바구니 항목의 카탈로그 상태(조회 시 파생). ACTIVE만 주문 가능(isOrderable)."
      enum: [ACTIVE, SELLER_UNAVAILABLE, SALE_ENDED, SALE_SUSPENDED, OPTION_UNAVAILABLE, OUT_OF_STOCK]
    CartItemResponse:
      type: object
      required: [cartItemId, productId, optionCombinationId, productName, thumbnail, selectedOptions, quantity, originalPrice, price, discountRate, remainingStock, itemStatus, isOrderable]
      properties:
        cartItemId:
          type: integer
          format: int64
        productId:
          type: string
          description: "products.public_id (ULID)"
        optionCombinationId:
          type: integer
          format: int64
        productName:
          type: string
        thumbnail:
          type: string
          nullable: true
          description: "대표 이미지 URL. 없으면 null"
        selectedOptions:
          type: string
          description: "선택 옵션 표시 문자열(예: '닭고기 / 1kg')"
        quantity:
          type: integer
        originalPrice:
          type: integer
          format: int64
          description: >-
            할인 전 단가(정가 + 옵션 추가금). price와 discountRate만으로 역산하면 옵션 추가금에도
            할인이 걸린 값이 나와 서버가 직접 내려준다. 원가 취소선 표시에 쓴다.
        price:
          type: integer
          format: int64
          description: "판매가(할인 반영) + 옵션 추가금이 합산된 단가. 주문 금액 계산의 기준"
        discountRate:
          type: integer
          nullable: true
          description: "상품 정가 기준 할인율(%). 할인 기간이 아니면 null"
        remainingStock:
          type: integer
          description: "마스킹하지 않은 잔여 재고 — 담아둔 수량 초과 여부는 클라이언트가 판정"
        itemStatus:
          $ref: "#/components/schemas/CartItemStatus"
        isOrderable:
          type: boolean
    CartSellerGroupResponse:
      type: object
      required: [sellerId, storeName, baseShippingFee, freeShippingThreshold, items]
      properties:
        sellerId:
          type: integer
          format: int64
        storeName:
          type: string
        baseShippingFee:
          type: integer
          format: int64
        freeShippingThreshold:
          type: integer
          format: int64
          nullable: true
          description: "무료배송 임계 금액. null이면 항상 baseShippingFee"
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItemResponse"
    CartResponse:
      type: object
      required: [sellerGroups]
      properties:
        sellerGroups:
          type: array
          items:
            $ref: "#/components/schemas/CartSellerGroupResponse"
    CartEnvelope:
