    ApplicationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, REVIEWING, APPROVED, REJECTED, CANCELLED]
      description: >-
        입점 신청 상태. 현재 서버가 실제로 할당하는 값은 DRAFT/SUBMITTED/APPROVED/REJECTED이고
        REVIEWING·CANCELLED은 정의만 존재한다(도달 경로 없음 — 어드민 심사 API 확장 대비)
    BusinessType:
      type: string
      enum: [PERSONAL_GENERAL, SOLE_PROPRIETORSHIP, CORPORATE]
      description: "셀러 유형 — 개인 일반/개인 사업자/법인 사업자. 제출 시점의 유형 기준으로 필수 정보·서류를 재평가한다"
    SellerDocumentType:
      type: string
      enum: [ID_CARD, BANKBOOK_COPY, BUSINESS_REGISTRATION, TELESALES_REPORT, CORP_REGISTER, CORP_SEAL]
      description: >-
        입점 서류 종류(서버 DocumentType). 유형별 필수 세트 — PERSONAL_GENERAL: 신분증·통장 사본 /
        SOLE_PROPRIETORSHIP: + 사업자등록증·통신판매업 신고증 / CORPORATE: 6종 전부
    SellerApplicationDocument:
      type: object
      required: [documentType, uploadedAt]
      properties:
        documentType:
          $ref: "#/components/schemas/SellerDocumentType"
        uploadedAt:
          type: string
          description: "등록/교체 시각 — LocalDateTime 직렬화라 타임존 오프셋이 없다"
    SellerApplicationDetail:
      type: object
      required: [applicationId, status, businessType, businessName, businessRegNo, corpRegNo,
                 representativeName, telesalesNumber, bankCode, accountNumberMasked, accountHolder,
                 appliedAt, submittedAt, decidedAt, rejectionReason, documents]
      properties:
        applicationId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ApplicationStatus"
        businessType:
          $ref: "#/components/schemas/BusinessType"
        businessName:
          type: string
          nullable: true
        businessRegNo:
          type: string
          nullable: true
        corpRegNo:
          type: string
          nullable: true
        representativeName:
          type: string
          nullable: true
        telesalesNumber:
          type: string
          nullable: true
        bankCode:
          type: string
          nullable: true
        accountNumberMasked:
          type: string
          nullable: true
          description: "뒤 4자리 외 전부 '*'. 평문 계좌번호는 응답에 절대 실리지 않는다 — 수정하려면 사용자가 다시 입력해야 한다"
        accountHolder:
          type: string
          nullable: true
        appliedAt:
          type: string
          description: "신청 생성 시각(LocalDateTime)"
        submittedAt:
          type: string
          nullable: true
        decidedAt:
          type: string
          nullable: true
        rejectionReason:
          type: string
          nullable: true
          description: "status가 REJECTED일 때만 값이 있고 그 외에는 항상 null"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/SellerApplicationDocument"
    SellerApplicationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerApplicationDetail"
    SellerApplicationDocumentInput:
      type: object
      required: [documentType, tmpKey]
      properties:
        documentType:
          $ref: "#/components/schemas/SellerDocumentType"
        tmpKey:
          type: string
          description: "presigned 발급(purpose=SELLER_DOCUMENT) 응답의 key를 그대로 싣는다"
    SaveSellerApplicationDraftRequest:
      type: object
      required: [businessType]
      description: >-
        폼 필드는 전체 덮어쓰기(생략/null이면 소거), documents는 부분 upsert(같은 종류는 한 요청에
        한 번만 — 위반 400 errorCode 90001). 계좌번호는 응답이 마스킹뿐이라 수정 시 재입력 필요.
      properties:
        businessType:
          $ref: "#/components/schemas/BusinessType"
        businessName:
          type: string
          nullable: true
          maxLength: 100
        businessRegNo:
          type: string
          nullable: true
          description: "하이픈 허용 10자리 + 국세청 체크섬. 위반 400 errorCode 90001"
        corpRegNo:
          type: string
          nullable: true
          maxLength: 20
        representativeName:
          type: string
          nullable: true
          maxLength: 50
        telesalesNumber:
          type: string
          nullable: true
          maxLength: 50
        bankCode:
          type: string
          nullable: true
          maxLength: 10
        accountNumber:
          type: string
          nullable: true
          maxLength: 64
          description: "평문 입력 — 서버가 암호화 저장하고 응답에는 accountNumberMasked만 온다"
        accountHolder:
          type: string
          nullable: true
          maxLength: 50
        documents:
          type: array
          items:
            $ref: "#/components/schemas/SellerApplicationDocumentInput"
    SendPhoneCodeRequest:
      type: object
      required: [phoneNumber]
      properties:
        phoneNumber:
          type: string
          description: "^01[016789]-?\\d{3,4}-?\\d{4}$ — 하이픈 유무 모두 허용. 위반 400 errorCode 90001"
    ConfirmPhoneCodeRequest:
      type: object
      required: [phoneNumber, code]
      properties:
        phoneNumber:
          type: string
          description: "발송 때 보낸 번호와 같아야 한다 — 불일치는 코드 오류와 함께 30005로 통합"
        code:
          type: string
          description: "6자리 숫자(^\\d{6}$). 형식 위반 400 errorCode 90001"
    PhoneCodeSent:
      type: object
      required: [expiresInSeconds, resendCooldownSeconds]
      properties:
        expiresInSeconds:
          type: integer
          description: "인증번호 유효시간(초, 현재 180). FE 만료 타이머의 원천 — 하드코딩 금지"
        resendCooldownSeconds:
          type: integer
          description: "재발송 쿨다운(초, 현재 60). FE 재발송 타이머의 원천 — 하드코딩 금지"
    PhoneCodeSentResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/PhoneCodeSent"
    # 내 정보. 8필드는 항상 존재하고(키 고정), PENDING_ONBOARDING이면 프로필 계열이 전부 null이라 값만 nullable이다.
    UserMe:
      type: object
      required: [status, nickname, profileImageUrl, profileImageKey, bio, email, phoneNumber, isPhoneVerified]
      properties:
        status:
          type: string
          description: "계정 상태 — PENDING_ONBOARDING | ACTIVE | SUSPENDED | WITHDRAWN. 닉네임 설정 완료 후 ACTIVE"
        nickname:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          nullable: true
          description: "표시용 URL. 서버가 조립해 내려준다"
        profileImageKey:
          type: string
          nullable: true
          description: "스토리지 키. 프로필 수정에서 사진을 유지하려면 이 값을 그대로 되돌려 보낸다(URL 역파싱 금지)"
        bio:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
          description: "마스킹 표시용"
        phoneNumber:
          type: string
          nullable: true
          description: "인증 전 null, 인증 후 서버 마스킹 표시용(예: 010-****-5678)"
        isPhoneVerified:
          type: boolean
    UserMeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserMe"
    UpdateProfileRequest:
      type: object
      required: [nickname, bio, profileImageKey]
      description: "전체 교체 — 세 필드를 항상 보낸다. bio·profileImageKey가 null이면 값이 지워진다."
      properties:
        nickname:
          type: string
          description: "NFC 정규화 후 ^[가-힣a-zA-Z0-9]{2,12}$. 위반 400 errorCode 30002, 중복 409 errorCode 30001"
        bio:
          type: string
          nullable: true
          maxLength: 150
          description: "자기소개. 150자 초과 400 errorCode 90001. 비우려면 null"
        profileImageKey:
          type: string
          nullable: true
          description: "유지할 기존 키 또는 새 tmp 키. null이면 사진 제거"
    SubmitInquiryRequest:
      type: object
      required: [inquiryType, replyEmail, content]
      properties:
        inquiryType:
          type: string
          enum: [ACCOUNT, ORDER_PAYMENT, DELIVERY_CLAIM, SELLER_PRODUCT, SERVICE_ETC]
          description: "문의 유형"
        replyEmail:
          type: string
          format: email
          description: "답변받을 이메일. 형식 위반 400 INVALID_REQUEST"
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: "문의 내용. 1~2000자"
    SubmitInquiryResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status, createdAt]
          properties:
            status:
              type: string
              description: "접수 상태. RECEIVED"
            createdAt:
              type: string
              description: "접수 시각 ISO-8601"
    InspectionStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED]
      description: >-
        상품 심사 상태. 지금 서버는 등록 즉시 APPROVED를 매기고 DRAFT·PENDING·REJECTED로 가는
        경로가 없다(심사 기능 확장 대비 정의만 존재)
    SellerAssignableSaleStatus:
      type: string
      enum: [ON_SALE, SUSPENDED]
      description: >-
        셀러가 직접 지정할 수 있는 판매 상태. 품절은 재고에서 파생되고 판매종료는 도달 경로가
        없어서 이 두 값만 받는다(그 밖은 400 errorCode 90001)
    SellerProductOptionGroupInput:
      type: object
      required: [name, values]
      properties:
        name:
          type: string
          maxLength: 100
          description: "옵션 그룹명(예: 중량). 비어 있으면 400 errorCode 90001"
        values:
          type: array
          minItems: 1
          items:
            type: string
            maxLength: 100
          description: "그룹에 속한 옵션값 이름. 비어 있으면 400 errorCode 90001"
    SellerProductOptionCombinationInput:
      type: object
      required: [optionValues, additionalPrice, stockQuantity]
      properties:
        optionValues:
          type: array
          items:
            type: string
          description: >-
            이 조합이 가리키는 옵션값 이름들. 옵션이 없는 상품은 빈 배열 한 행만 보내고
            서버가 이름을 "기본"으로 붙인다
        additionalPrice:
          type: integer
          format: int64
          minimum: 0
          description: "추가금. 음수는 400 errorCode 40201"
        stockQuantity:
          type: integer
          minimum: 0
          description: "재고. 음수는 400 errorCode 40200"
    SellerProductRegisterRequest:
      type: object
      required: [categoryId, productName, regularPrice, thumbnailImageKey, optionCombinations]
      properties:
        categoryId:
          type: integer
          format: int64
          description: "활성 소분류(depth 3)만. 중·대분류는 400 errorCode 40100, 없으면 404 errorCode 40101"
        productName:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
          description: "상품 설명. 길이 제약이 없다"
        regularPrice:
          type: integer
          format: int64
          minimum: 100
          maximum: 100000000
          description: "정가. 범위를 벗어나면 400 errorCode 40001"
        discountPrice:
          type: integer
          format: int64
          nullable: true
          description: "할인가. 0 이상 정가 이하만. 벗어나면 400 errorCode 40001"
        discountStartAt:
          type: string
          nullable: true
          description: >-
            할인 시작 시각(오프셋 없는 LocalDateTime). discountPrice가 있으면 필수이고,
            discountPrice 없이 기간만 보내면 400 errorCode 40002
        discountEndAt:
          type: string
          nullable: true
          description: "할인 종료 시각. 비우면 무기한. 시작이 종료보다 늦으면 400 errorCode 40002"
        thumbnailImageKey:
          type: string
          maxLength: 1024
          description: "presigned로 받은 tmp 키"
        additionalImageKeys:
          type: array
          nullable: true
          maxItems: 9
          items:
            type: string
            maxLength: 1024
          description: "추가 이미지 키. 생략하면 빈 목록. 9장 초과는 400 errorCode 40003"
        detailImageKeys:
          type: array
          nullable: true
          maxItems: 20
          items:
            type: string
            maxLength: 1024
          description: "상세 이미지 키. 20장 초과는 400 errorCode 40003"
        optionGroups:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/SellerProductOptionGroupInput"
          description: "옵션이 없는 상품은 생략한다"
        optionCombinations:
          type: array
          items:
            $ref: "#/components/schemas/SellerProductOptionCombinationInput"
          description: >-
            조합은 비울 수 없다. 불변식 위반은 전부 400 errorCode 40005이고 message에 사유가 실린다 —
            그룹명 중복 금지, 옵션값 이름은 그룹을 넘어서도 중복 금지, 그룹에 없는 값 지목 금지,
            조합이 모든 그룹을 덮어야 함, 같은 값 집합의 조합 중복 금지
    SellerProductRegisterData:
      type: object
      required: [productId, saleStatus, inspectionStatus, versionNo, createdAt]
      properties:
        productId:
          type: string
          description: "상품 공개 식별자(ULID 26자)"
        saleStatus:
          $ref: "#/components/schemas/SaleStatus"
        inspectionStatus:
          $ref: "#/components/schemas/InspectionStatus"
        versionNo:
          type: integer
        createdAt:
          type: string
          description: "오프셋 없는 LocalDateTime 직렬화"
    SellerProductRegisterResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerProductRegisterData"
    SellerProductUpdateRequest:
      type: object
      required: [categoryId, productName, regularPrice, thumbnailImageKey]
      description: >-
        등록 요청에서 옵션 두 필드를 뺀 모양이다. 이미지 목록은 전체 교체이고, 각 목록 안의
        키 중복은 400 errorCode 90001로 거절한다(등록에는 없는 검증)
      properties:
        categoryId:
          type: integer
          format: int64
        productName:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        regularPrice:
          type: integer
          format: int64
          minimum: 100
          maximum: 100000000
        discountPrice:
          type: integer
          format: int64
          nullable: true
        discountStartAt:
          type: string
          nullable: true
        discountEndAt:
          type: string
          nullable: true
        thumbnailImageKey:
          type: string
          maxLength: 1024
        additionalImageKeys:
          type: array
          nullable: true
          maxItems: 9
          items:
            type: string
            maxLength: 1024
        detailImageKeys:
          type: array
          nullable: true
          maxItems: 20
          items:
            type: string
            maxLength: 1024
    SellerProductUpdateData:
      type: object
      required: [productId, saleStatus, updatedAt]
      properties:
        productId:
          type: string
        saleStatus:
          $ref: "#/components/schemas/SaleStatus"
        updatedAt:
          type: string
    SellerProductUpdateResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerProductUpdateData"
    SellerProductDetailData:
      type: object
      required:
        [
          productId,
          categoryId,
          productName,
          description,
          regularPrice,
          discountPrice,
          discountStartAt,
          discountEndAt,
          thumbnailImageKey,
          additionalImageKeys,
          detailImageKeys,
          saleStatus,
          inspectionStatus,
        ]
      description: >-
        수정 폼 프리필 값. 등록·수정 요청 DTO와 모양이 비슷하지만 상속 관계로 다루면 안 된다 —
        요청 DTO의 thumbnailImageKey는 @NotBlank non-null인데 이 응답은 null을 낼 수 있고,
        요청에 없는 saleStatus·inspectionStatus가 더 실린다.
      properties:
        productId:
          type: string
          description: "상품 공개 식별자(ULID 26자)"
        categoryId:
          type: integer
          format: int64
        productName:
          type: string
        description:
          type: string
          nullable: true
        regularPrice:
          type: integer
          format: int64
        discountPrice:
          type: integer
          format: int64
          nullable: true
        discountStartAt:
          type: string
          nullable: true
          description: "오프셋 없는 LocalDateTime. 그대로 PUT에 되돌려 보내면 시각이 유지된다"
        discountEndAt:
          type: string
          nullable: true
        thumbnailImageKey:
          type: string
          nullable: true
          description: >-
            대표 이미지 저장 키. **null로 올 수 있다** — 도메인이 대표 이미지 없는 상품을
            허용하고(등록·수정 API로는 만들 수 없는 상태지만 서버가 500 대신 null을 보증한다)
            그 경우 수정 폼은 재업로드를 받아야 한다. required이면서 nullable인 이유는 키가
            빠지는 게 아니라 값이 null로 오기 때문이다.
        additionalImageKeys:
          type: array
          items:
            type: string
          description: "종류별 sortOrder 오름차순. 빈 배열 가능"
        detailImageKeys:
          type: array
          items:
            type: string
          description: "종류별 sortOrder 오름차순. 빈 배열 가능"
        saleStatus:
          $ref: "#/components/schemas/SaleStatus"
        inspectionStatus:
          $ref: "#/components/schemas/InspectionStatus"
    SellerProductDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SellerProductDetailData"
    CourierSummary:
      type: object
      required: [courierCode, courierName, trackingFormatPattern]
      properties:
        courierCode:
          type: string
          description: >-
            courier_masters PK. 시드는 대문자(CJ·LOTTE·HANJIN·LOGEN·POST)이고 어댑터가 정확
            일치로 찾는다 — 화면이 대소문자를 바꾸지 말고 이 값을 그대로 다시 보내야 한다
        courierName:
          type: string
          description: "표시용 택배사명(예: CJ대한통운)"
        trackingFormatPattern:
          type: string
          nullable: true
          description: >-
            송장번호 정규식. 미정이면 null이고 그때는 클라이언트 선검증을 하지 않는다
            (서버는 패턴 불일치를 400 errorCode 50304로 거절한다)
    CourierListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CourierSummary"
    CourierListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CourierListData"
    SellerSettlementStatus:
      type: string
      enum: [pending, scheduled, completed, held]
      description: >-
        정산 상태(화면 어휘 소문자). pending 정산 대기 / scheduled 정산 예정 /
        completed 정산 완료 / held 정산 보류. 서버가 주문 단위로 접을 때 보류가 가장 세고
        그다음은 덜 진행된 쪽이다
    SellerSettlementSummary:
      type: object
      required:
        [
          orderId,
          settlementMonth,
          confirmedAt,
          expectedPayoutDate,
          productAmount,
          feeAmount,
          finalAmount,
          status,
        ]
      properties:
        orderId:
          type: string
          description: "주문 공개 식별자(ULID). 상세 조회 경로에 그대로 싣는다"
        settlementMonth:
          type: string
          description: "정산월(`yyyy-MM`). 구매확정일에서 뽑으므로 월 필터가 늘 걸린다"
        confirmedAt:
          type: string
          nullable: true
          description: "구매확정 시각. 오프셋 없는 LocalDateTime(예: 2026-06-18T10:00:00)"
        expectedPayoutDate:
          type: string
          description: "지급 예정일(`yyyy-MM-dd`). 구매확정일 +5일(역일)이다"
        productAmount:
          type: integer
          format: int64
          description: "상품 금액 합(원). 품목 grossAmount의 합이다"
        feeAmount:
          type: integer
          format: int64
          description: "수수료 합(원) = platformFeeAmount + pgFeeAmount. 쿠폰 부담·환불 차감은 포함하지 않는다"
        finalAmount:
          type: integer
          format: int64
          description: >-
            지급 예정액 합(원) = productAmount + shippingFee - couponBurden - feeAmount
            - refundDeduction. 저장된 원장 값이라 화면이 다시 계산하지 않는다
        status:
          $ref: "#/components/schemas/SellerSettlementStatus"
    SellerSettlementListData:
      type: object
      required: [settlements, totalCount, page, size, totalPages, hasNext]
      properties:
        settlements:
          type: array
