name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소해 Actions 분(minute)을 아낀다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck / lint / test / openapi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager(pnpm@11.9.0)에서 자동 감지된다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit / component)
        run: pnpm test

      - name: OpenAPI generate check
        run: pnpm openapi:generate:check

  e2e:
    name: e2e (web-buyer / web-seller / web-admin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 세 앱 모두 spec을 갖췄다(buyer 45 / seller 6 / admin 4). 브라우저는 한 번만 받으면
      # 세 앱이 같은 캐시를 쓰므로 설치는 한 줄로 끝낸다.
      - name: Install Playwright browsers
        run: pnpm --filter web-buyer exec playwright install --with-deps chromium

      # 앱마다 포트가 달라(5175/5173/5174) 병행해도 충돌하지 않지만, 실패한 앱을 로그에서
      # 바로 가리려고 단계를 나눈다. 앞 단계가 실패해도 나머지를 돌려 한 번에 전모를 본다.
      - name: Run e2e (web-buyer)
        run: pnpm --filter web-buyer test:e2e

      - name: Run e2e (web-seller)
        if: ${{ !cancelled() }}
        run: pnpm --filter web-seller test:e2e

      - name: Run e2e (web-admin)
        if: ${{ !cancelled() }}
        run: pnpm --filter web-admin test:e2e

      # 앱별로 report 디렉터리가 따로이므로 아티팩트 이름도 갈라 올린다(같은 이름으로 올리면
      # 뒤 업로드가 앞을 덮는다).
      - name: Upload Playwright report (web-buyer)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-buyer
          path: apps/web-buyer/playwright-report/
          retention-days: 7

      - name: Upload Playwright report (web-seller)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-seller
          path: apps/web-seller/playwright-report/
          retention-days: 7

      - name: Upload Playwright report (web-admin)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web-admin
          path: apps/web-admin/playwright-report/
          retention-days: 7
